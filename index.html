<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        /* Reset et plein écran */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212; /* Mode sombre par défaut */
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Initialisation de la carte centrée sur la Lorraine
        const map = L.map('map').setView([48.6936, 6.1846], 9);

        /* Utilisation de l'endpoint à jour de la Géoplateforme IGN (tuiles Plan IGN)
           Rappel : Les anciennes URL géoportail/wxs sont obsolètes !
        */
        const planIGN = L.tileLayer('https://data.geopf.fr/tms/1.0.0/PLAN_IGN_V2/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.ign.fr/">IGN</a>',
            minZoom: 0,
            maxZoom: 22
        }).addTo(map);

        // Exemple d'ajout d'un fond OpenStreetMap standard en alternative
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        // Contrôle des couches
        const baseMaps = {
            "Plan IGN (À jour)": planIGN,
            "OpenStreetMap": osm
        };
        L.control.layers(baseMaps).addTo(map);
    </script>
</body>
</html>
