<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .leaflet-popup-content h4 {
            margin: 0 0 8px 0;
            color: #3388ff;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        .leaflet-popup-content ul {
            padding-left: 15px;
            margin: 5px 0;
        }
        
        /* Panneau de contrôle style sombre */
        .custom-layer-control {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #222222;
            color: #ffffff;
            border: 2px solid #444444;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            width: 260px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .tiroir-menu {
            margin-top: 8px;
        }
        .tiroir-menu summary {
            font-weight: bold;
            color: #00ffcc;
            cursor: pointer;
            padding: 6px 0;
            border-bottom: 1px solid #444;
            outline: none;
            user-select: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .tiroir-contenu {
            padding: 8px 4px 4px 4px;
        }
        .item-couche {
            margin-bottom: 10px;
        }
        .item-couche label {
            display: block;
            cursor: pointer;
            white-space: nowrap;
            margin-bottom: 2px;
        }
        .item-couche input[type="checkbox"], 
        .item-couche input[type="radio"] {
            margin-right: 8px;
            vertical-align: middle;
        }
        .slider-opacite {
            display: block;
            width: 90%;
            margin: 2px 0 0 22px;
            height: 4px;
            background: #444;
            outline: none;
            accent-color: #00ffcc;
            cursor: pointer;
        }
        .bloc-fonds {
            padding-left: 4px;
            margin-bottom: 10px;
        }
        .bloc-fonds label {
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .bloc-fonds input[type="radio"] {
            margin-right: 8px;
            vertical-align: middle;
        }
        .bloc-fonds .slider-opacite {
            margin-left: 4px;
            width: 95%;
        }
        .decalage-sous-couche {
            padding-left: 18px; 
        }
        .titre-fond-carte {
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
        }
        .info.legend {
            background: #222222;
            color: #ffffff;
            padding: 12px;
            border: 2px solid #444444;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            line-height: 18px;
        }
        .info.legend h4 {
            margin: 0 0 8px 0;
            color: #00ffcc;
            font-size: 14px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        .legend i {
            width: 18px;
            height: 6px;
            float: left;
            margin-right: 8px;
            margin-top: 6px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="controlPanel" class="custom-layer-control">
        <span class="titre-fond-carte">Fond de carte</span>
        <div class="bloc-fonds">
            <label><input type="radio" name="basemap" id="rbPlanIGN" checked>Plan IGN (Officiel)</label>
            <label><input type="radio" name="basemap" id="rbOSM">OpenStreetMap</label>
            <input type="range" class="slider-opacite" id="sldBasemap" min="0" max="100" value="100">
        </div>

        <details class="tiroir-menu" open>
            <summary>Territoires</summary>
            <div class="tiroir-contenu">
                <div class="item-couche">
                    <label><input type="checkbox" id="chkLimitesSL" checked>Limites Sud-Lorraine</label>
                    <input type="range" class="slider-opacite" id="sldLimitesSL" min="0" max="100" value="100">
                </div>
                <div class="decalage-sous-couche">
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSudMeuse" checked>Sud Meuse</label>
                        <input type="range" class="slider-opacite" id="sldSudMeuse" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSud54" checked>Sud 54</label>
                        <input type="range" class="slider-opacite" id="sldSud54" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkVosgesOuest" checked>Vosges Ouest</label>
                        <input type="range" class="slider-opacite" id="sldVosgesOuest" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSDDV" checked>Saint-Dié (SDDV)</label>
                        <input type="range" class="slider-opacite" id="sldSDDV" min="0" max="100" value="100">
                    </div>
                </div>
            </div>
        </details>

        <details class="tiroir-menu" open>
            <summary>Cours d'eau</summary>
            <div class="tiroir-contenu">
                <div class="item-couche">
                    <label><input type="radio" name="qualiteCE" id="rbCEGlobale" value="globale" checked>Qualité globale</label>
                    <input type="range" class="slider-opacite" id="sldCEGlobale" min="0" max="100" value="85">
                </div>
                <div class="item-couche">
                    <label><input type="radio" name="qualiteCE" id="rbCEEcologique" value="ecologique">Qualité écologique</label>
                    <input type="range" class="slider-opacite" id="sldCEEcologique" min="0" max="100" value="85">
                </div>
                <div class="item-couche">
                    <label><input type="radio" name="qualiteCE" id="rbCEChimique" value="chimique">Qualité chimique</label>
                    <input type="range" class="slider-opacite" id="sldCEChimique" min="0" max="100" value="85">
                </div>
            </div>
        </details>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        // -------------------------------------------------------------
        // PARSEUR ROBUSTE DES VALEURS DE QUALITÉ (Accents + Codes)
        // -------------------------------------------------------------
        function getColorByQuality(valeur) {
            if (!valeur) return "#888888";
            const v = valeur.toString().trim().toLowerCase();
            
            // Équivalences Textes et Codes Numériques courants du SDAGE
            if (v === "très bon" || v === "très bon état" || v === "1") return "#0055ff"; 
            if (v === "bon" || v === "bon état" || v === "2") return "#33bbff";          
            if (v === "moyen" || v === "état moyen" || v === "3") return "#ffd000";      
            if (v === "médiocre" || v === "médiocre état" || v === "4") return "#ff7700"; 
            if (v === "mauvais" || v === "mauvais état" || v === "5") return "#ff0000";   
            if (v === "non atteint" || v === "u" || v === "pas atteint") return "#a020f0";                       
            return "#888888"; 
        }

        // Configuration carte
        const map = L.map('map').setView([48.4500, 6.2000], 9);

        const planIGN = L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; IGN'
        }).addTo(map);

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');

        // Groupes Leaflet
        const coucheLimitesSL = L.layerGroup().addTo(map);
        const coucheSudMeuse = L.layerGroup().addTo(map);
        const coucheSud54 = L.layerGroup().addTo(map);
        const coucheVosgesOuest = L.layerGroup().addTo(map);
        const coucheSDDV = L.layerGroup().addTo(map);

        const coucheCEQualiteGlobale = L.layerGroup().addTo(map); 
        const coucheCEQualiteEcologique = L.layerGroup();
        const coucheCEQualiteChimique = L.layerGroup();

        let geojsonLimitesSL, geojsonSudMeuse, geojsonSud54, geojsonVosgesOuest, geojsonSDDV;
        let geojsonCEGlobale, geojsonCEEcologique, geojsonCEChimique;
        
        let rawMassesEaux = null;
        let territoiresPolygones = {}; 

        // Charger les données
        fetch('data/Limites SL.geojson').then(r => r.json()).then(data => {
            geojsonLimitesSL = L.geoJSON(data, { style: { color: "#ffffff", weight: 3, dashArray: "6, 6", fillOpacity: 0 } }).addTo(coucheLimitesSL);
        });

        fetch('data/Plaque SudMeuse.geojson').then(r => r.json()).then(d => { territoiresPolygones["Sud Meuse"] = d; geojsonSudMeuse = L.geoJSON(d, { style: { color: '#e6194B', weight: 2, fillColor: '#e6194B', fillOpacity: 0.08 } }).addTo(coucheSudMeuse); tenterCalculIntersections(); });
        fetch('data/Plaque Sud54.geojson').then(r => r.json()).then(d => { territoiresPolygones["Sud54"] = d; geojsonSud54 = L.geoJSON(d, { style: { color: '#3cb44b', weight: 2, fillColor: '#3cb44b', fillOpacity: 0.08 } }).addTo(coucheSud54); tenterCalculIntersections(); });
        fetch('data/Plaque Vosges Ouest.geojson').then(r => r.json()).then(d => { territoiresPolygones["Vosges Ouest"] = d; geojsonVosgesOuest = L.geoJSON(d, { style: { color: '#ffe119', weight: 2, fillColor: '#ffe119', fillOpacity: 0.08 } }).addTo(coucheVosgesOuest); tenterCalculIntersections(); });
        fetch('data/Plaque SDDV.geojson').then(r => r.json()).then(d => { territoiresPolygones["SDDV"] = d; geojsonSDDV = L.geoJSON(d, { style: { color: '#4363d8', weight: 2, fillColor: '#4363d8', fillOpacity: 0.08 } }).addTo(coucheSDDV); tenterCalculIntersections(); });

        fetch('data/Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson').then(r => r.json()).then(data => {
            rawMassesEaux = data;
            tenterCalculIntersections();
        });

        // -------------------------------------------------------------
        // TRONÇONNAGE ET INDEXATION INITIALE (ANTI-DEBORDEMENT)
        // -------------------------------------------------------------
        function tenterCalculIntersections() {
            if (!rawMassesEaux || !territoiresPolygones["Sud Meuse"] || !territoiresPolygones["Sud54"] || !territoiresPolygones["Vosges Ouest"] || !territoiresPolygones["SDDV"]) {
                return; 
            }

            let segmentsDecoupes = [];

            rawMassesEaux.features.forEach(line => {
                // On va regarder pour chaque territoire si la ligne le traverse
                for (let nomKey in territoiresPolygones) {
                    let polyCollection = territoiresPolygones[nomKey];
                    
                    polyCollection.features.forEach(polyFeature => {
                        try {
                            if (turf.booleanIntersects(line, polyFeature)) {
                                // Extraction stricte de la partie de la ligne contenue DANS le polygone (Opération de Clip)
                                let intersection = turf.lineIntersect(line, polyFeature);
                                
                                // On utilise Turf pour découper la ligne proprement aux frontières
                                let splitLines = turf.lineSplit(line, polyFeature);
                                
                                if (splitLines.features.length === 0) {
                                    // La ligne est entièrement au-dedans
                                    let clone = JSON.parse(JSON.stringify(line));
                                    clone.properties._territoireStrict = nomKey;
                                    segmentsDecoupes.push(clone);
                                } else {
                                    // On teste chaque sous-segment pour savoir s'il est dedans ou dehors
                                    splitLines.features.forEach(subLine => {
                                        let midPoint = turf.midpoint(subLine.geometry.coordinates[0], subLine.geometry.coordinates[subLine.geometry.coordinates.length - 1]);
                                        if (turf.booleanPointInPolygon(midPoint, polyFeature)) {
                                            let cloneSub = JSON.parse(JSON.stringify(subLine));
                                            cloneSub.properties = Object.assign({}, line.properties); // Conserve les propriétés originales (qualité, nom...)
                                            cloneSub.properties._territoireStrict = nomKey;
                                            segmentsDecoupes.push(cloneSub);
                                        }
                                    });
                                }
                            }
                        } catch(e) {
                            // En cas d'erreur de topologie mineure, on garde la ligne originale associée au territoire
                            if(turf.booleanIntersects(line, polyFeature)) {
                                let cloneFallback = JSON.parse(JSON.stringify(line));
                                cloneFallback.properties._territoireStrict = nomKey;
                                segmentsDecoupes.push(cloneFallback);
                            }
                        }
                    });
                }
            });

            // On remplace la collection brute par notre collection tronçonnée sur mesure
            rawMassesEaux.features = segmentsDecoupes;
            filtrerEtAfficherCoursDeau();
        }

        // -------------------------------------------------------------
        // FILTRAGE ET RENDU GRAPHIQUE INSTANTANÉ
        // -------------------------------------------------------------
        function filtrerEtAfficherCoursDeau() {
            if (!rawMassesEaux) return;

            coucheCEQualiteGlobale.clearLayers();
            coucheCEQualiteEcologique.clearLayers();
            coucheCEQualiteChimique.clearLayers();

            const toutSudLorraine = document.getElementById('chkLimitesSL').checked;
            
            let listeTagsActifs = [];
            if (document.getElementById('chkSudMeuse').checked) listeTagsActifs.push("Sud Meuse");
            if (document.getElementById('chkSud54').checked) listeTagsActifs.push("Sud54");
            if (document.getElementById('chkVosgesOuest').checked) listeTagsActifs.push("Vosges Ouest");
            if (document.getElementById('chkSDDV').checked) listeTagsActifs.push("SDDV");

            // Filtrage strict par rapport au morceau découpé
            let featuresFiltrees = rawMassesEaux.features.filter(f => {
                if (toutSudLorraine) return true;
                return listeTagsActifs.includes(f.properties._territoireStrict);
            });

            const geojsonFiltre = { type: "FeatureCollection", features: featuresFiltrees };

            // Rendu avec tolérance sur le nommage des colonnes (gère les accents et espaces)
            geojsonCEGlobale = L.geoJSON(geojsonFiltre, {
                style: function(f) { 
                    let val = f.properties["Etat masse eau "] || f.properties["Etat masse eau"] || f.properties["Etat_masse_eau"];
                    return { color: getColorByQuality(val), weight: 3, opacity: document.getElementById('sldCEGlobale').value / 100 }; 
                },
                onEachFeature: genererPopup
            }).addTo(coucheCEQualiteGlobale);

            geojsonCEEcologique = L.geoJSON(geojsonFiltre, {
                style: function(f) { 
                    let val = f.properties["Etat ecologique"] || f.properties["Etat écologique"] || f.properties["Etat_ecologique"];
                    return { color: getColorByQuality(val), weight: 3, opacity: document.getElementById('sldCEEcologique').value / 100 }; 
                },
                onEachFeature: genererPopup
            });

            geojsonCEChimique = L.geoJSON(geojsonFiltre, {
                style: function(f) { 
                    let val = f.properties["Etat chimique"] || f.properties["Etat_chimique"];
                    return { color: getColorByQuality(val), weight: 3, opacity: document.getElementById('sldCEChimique').value / 100 }; 
                },
                onEachFeature: genererPopup
            });

            rafraichirQualiteCoursDeau();
        }

        function genererPopup(f, layer) {
            const props = f.properties;
            let glob = props["Etat masse eau "] || props["Etat masse eau"] || "Non renseigné";
            let eco = props["Etat ecologique"] || props["Etat écologique"] || "Non renseigné";
            let chim = props["Etat chimique"] || "Non renseigné";

            layer.bindPopup(`
                <h4>${props.NomMasseDEau || "Cours d'eau"}</h4>
                <ul>
                    <li><b>Qualité Globale :</b> ${glob}</li>
                    <li><b>Qualité Écologique :</b> ${eco}</li>
                    <li><b>Qualité Chimique :</b> ${chim}</li>
                </ul>
            `);
        }

        // Gestion du panneau et des déclencheurs
        const panel = document.getElementById('controlPanel');
        L.DomEvent.disableClickPropagation(panel);
        L.DomEvent.disableScrollPropagation(panel);

        function rafraichirOpaciteBasemap() {
            const alpha = document.getElementById('sldBasemap').value / 100;
            planIGN.setOpacity(alpha); osm.setOpacity(alpha);
        }
        document.getElementById('rbPlanIGN').addEventListener('change', function() { if(this.checked) { map.addLayer(planIGN); map.removeLayer(osm); rafraichirOpaciteBasemap(); } });
        document.getElementById('rbOSM').addEventListener('change', function() { if(this.checked) { map.addLayer(osm); map.removeLayer(planIGN); rafraichirOpaciteBasemap(); } });
        document.getElementById('sldBasemap').addEventListener('input', rafraichirOpaciteBasemap);

        document.getElementById('chkLimitesSL').addEventListener('change', function() { this.checked ? map.addLayer(coucheLimitesSL) : map.removeLayer(coucheLimitesSL); filtrerEtAfficherCoursDeau(); });
        document.getElementById('chkSudMeuse').addEventListener('change', function() { this.checked ? map.addLayer(coucheSudMeuse) : map.removeLayer(coucheSudMeuse); filtrerEtAfficherCoursDeau(); });
        document.getElementById('chkSud54').addEventListener('change', function() { this.checked ? map.addLayer(coucheSud54) : map.removeLayer(coucheSud54); filtrerEtAfficherCoursDeau(); });
        document.getElementById('chkVosgesOuest').addEventListener('change', function() { this.checked ? map.addLayer(coucheVosgesOuest) : map.removeLayer(coucheVosgesOuest); filtrerEtAfficherCoursDeau(); });
        document.getElementById('chkSDDV').addEventListener('change', function() { this.checked ? map.addLayer(coucheSDDV) : map.removeLayer(coucheSDDV); filtrerEtAfficherCoursDeau(); });

        let optionQualiteActive = "globale";
        document.querySelectorAll('input[name="qualiteCE"]').forEach(radio => {
            radio.addEventListener('click', function() {
                optionQualiteActive = this.value;
                rafraichirQualiteCoursDeau();
            });
        });

        function rafraichirQualiteCoursDeau() {
            map.removeLayer(coucheCEQualiteGlobale); map.removeLayer(coucheCEQualiteEcologique); map.removeLayer(coucheCEQualiteChimique);
            if (optionQualiteActive === "globale") map.addLayer(coucheCEQualiteGlobale);
            if (optionQualiteActive === "ecologique") map.addLayer(coucheCEQualiteEcologique);
            if (optionQualiteActive === "chimique") map.addLayer(coucheCEQualiteChimique);
            legende.update();
        }

        function appliquerOpaciteVecteur(geojsonObject, valeurPourcent, estUnPolygone = true) {
            if (!geojsonObject) return;
            const alpha = valeurPourcent / 100;
            geojsonObject.setStyle({ opacity: alpha, fillOpacity: estUnPolygone ? alpha * 0.08 : 0 });
        }

        document.getElementById('sldLimitesSL').addEventListener('input', function() { appliquerOpaciteVecteur(geojsonLimitesSL, this.value, false); });
        document.getElementById('sldSudMeuse').addEventListener('input', function() { appliquerOpaciteVecteur(geojsonSudMeuse, this.value, true); });
        document.getElementById('sldSud54').addEventListener('input', function() { appliquerOpaciteVecteur(geojsonSud54, this.value, true); });
        document.getElementById('sldVosgesOuest').addEventListener('input', function() { appliquerOpaciteVecteur(geojsonVosgesOuest, this.value, true); });
        document.getElementById('sldSDDV').addEventListener('input', function() { appliquerOpaciteVecteur(geojsonSDDV, this.value, true); });

        document.getElementById('sldCEGlobale').addEventListener('input', function() { appliquerOpaciteVecteur(geojsonCEGlobale, this.value, false); });
        document.getElementById('sldCEEcologique').addEventListener('input', function() { appliquerOpaciteVecteur(geojsonCEEcologique, this.value, false); });
        document.getElementById('sldCEChimique').addEventListener('input', function() { appliquerOpaciteVecteur(geojsonCEChimique, this.value, false); });

        // Légende
        const legende = L.control({ position: 'bottomright' });
        legende.onAdd = function (map) { this._div = L.DomUtil.create('div', 'info legend'); this.update(); return this._div; };
        legende.update = function () {
            let typeQualite = "", items = [];
            if (map.hasLayer(coucheCEQualiteGlobale)) {
                typeQualite = "Qualité Globale";
                items = [{ label: "Bon / Très Bon", color: "#33bbff" }, { label: "Moyen", color: "#ffd000" }, { label: "Médiocre", color: "#ff7700" }, { label: "Mauvais", color: "#ff0000" }, { label: "Inconnu", color: "#888888" }];
            } else if (map.hasLayer(coucheCEQualiteEcologique)) {
                typeQualite = "Qualité Écologique";
                items = [{ label: "Très bon", color: "#0055ff" }, { label: "Bon", color: "#33bbff" }, { label: "Moyen", color: "#ffd000" }, { label: "Médiocre", color: "#ff7700" }, { label: "Mauvais", color: "#ff0000" }, { label: "Inconnu", color: "#888888" }];
            } else if (map.hasLayer(coucheCEQualiteChimique)) {
                typeQualite = "Qualité Chimique";
                items = [{ label: "Bon", color: "#33bbff" }, { label: "Non atteint / Pas bon", color: "#a020f0" }, { label: "Inconnu", color: "#888888" }];
            }
            if (!typeQualite) { this._div.style.display = 'none'; return; }
            this._div.style.display = 'block';
            let htmlContenu = `<h4>${typeQualite}</h4>`;
            items.forEach(item => { htmlContenu += `<i style="background: ${item.color}"></i> ${item.label}<br>`; });
            this._div.innerHTML = htmlContenu;
        };
        legende.addTo(map);
    </script>
</body>
</html>
