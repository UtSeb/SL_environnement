<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .leaflet-popup-content h4 {
            margin: 0;
            color: #3388ff;
            padding: 4px 2px;
            font-size: 14px;
            font-weight: bold;
        }
        
        /* Panneau de contrôle style sombre */
        .custom-layer-control {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #222222;
            color: #ffffff;
            border: 2px solid #444444;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            width: 260px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .tiroir-menu {
            margin-top: 8px;
        }
        .tiroir-menu summary {
            font-weight: bold;
            color: #00ffcc;
            cursor: pointer;
            padding: 6px 0;
            border-bottom: 1px solid #444;
            outline: none;
            user-select: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .tiroir-contenu {
            padding: 8px 4px 4px 4px;
        }
        .item-couche {
            margin-bottom: 10px;
        }
        .item-couche label {
            display: block;
            cursor: pointer;
            white-space: nowrap;
            margin-bottom: 2px;
        }
        .item-couche input[type="checkbox"], 
        .item-couche input[type="radio"] {
            margin-right: 8px;
            vertical-align: middle;
        }
        .slider-opacite {
            display: block;
            width: 90%;
            margin: 2px 0 0 22px;
            height: 4px;
            background: #444;
            outline: none;
            accent-color: #00ffcc;
            cursor: pointer;
        }
        .bloc-fonds {
            padding-left: 4px;
            margin-bottom: 10px;
        }
        .bloc-fonds label {
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .bloc-fonds input[type="radio"] {
            margin-right: 8px;
            vertical-align: middle;
        }
        .bloc-fonds .slider-opacite {
            margin-left: 4px;
            width: 95%;
        }
        .decalage-sous-couche {
            padding-left: 18px; 
        }
        .titre-fond-carte {
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
        }
        .info.legend {
            background: #222222;
            color: #ffffff;
            padding: 12px;
            border: 2px solid #444444;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            line-height: 18px;
        }
        .info.legend h4 {
            margin: 0 0 8px 0;
            color: #00ffcc;
            font-size: 14px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        .legend i {
            width: 18px;
            height: 6px;
            float: left;
            margin-right: 8px;
            margin-top: 6px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="controlPanel" class="custom-layer-control">
        <span class="titre-fond-carte">Fond de carte</span>
        <div class="bloc-fonds">
            <label><input type="radio" name="basemap" id="rbPlanIGN" checked>Plan IGN (Officiel)</label>
            <label><input type="radio" name="basemap" id="rbOSM">OpenStreetMap</label>
            <input type="range" class="slider-opacite" id="sldBasemap" min="0" max="100" value="100">
        </div>

        <details class="tiroir-menu" open>
            <summary>Territoires</summary>
            <div class="tiroir-contenu">
                <div class="item-couche">
                    <label><input type="checkbox" id="chkLimitesSL" checked>Limites Sud-Lorraine</label>
                    <input type="range" class="slider-opacite" id="sldLimitesSL" min="0" max="100" value="100">
                </div>
                <div class="decalage-sous-couche">
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSudMeuse" checked>Sud Meuse</label>
                        <input type="range" class="slider-opacite" id="sldSudMeuse" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSud54" checked>Sud 54</label>
                        <input type="range" class="slider-opacite" id="sldSud54" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkVosgesOuest" checked>Vosges Ouest</label>
                        <input type="range" class="slider-opacite" id="sldVosgesOuest" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSDDV" checked>Saint-Dié (SDDV)</label>
                        <input type="range" class="slider-opacite" id="sldSDDV" min="0" max="100" value="100">
                    </div>
                </div>
            </div>
        </details>

        <details class="tiroir-menu" open>
            <summary>Cours d'eau</summary>
            <div class="tiroir-contenu">
                <div class="item-couche">
                    <label><input type="checkbox" class="chk-qualite" id="chkCEGlobale" value="globale">Qualité globale</label>
                    <input type="range" class="slider-opacite" id="sldCEGlobale" min="0" max="100" value="85">
                </div>
                <div class="item-couche">
                    <label><input type="checkbox" class="chk-qualite" id="chkCEEcologique" value="ecologique">Qualité écologique</label>
                    <input type="range" class="slider-opacite" id="sldCEEcologique" min="0" max="100" value="85">
                </div>
                <div class="item-couche">
                    <label><input type="checkbox" class="chk-qualite" id="chkCEChimique" value="chimique">Qualité chimique</label>
                    <input type="range" class="slider-opacite" id="sldCEChimique" min="0" max="100" value="85">
                </div>
            </div>
        </details>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // -------------------------------------------------------------
        // FONCTION DE NETTOYAGE ET FORMATAGE DES NOMS DE COURS D'EAU
        // -------------------------------------------------------------
        function formaterNomCoursDeau(nomBrut) {
            if (!nomBrut) return "Cours d'eau inconnu";
            
            // 1. Enlever les chiffres (0-9)
            var sansChiffres = nomBrut.toString().replace(/[0-9]/g, '');
            
            // 2. Convertir tout en minuscules pour repartir sur une base propre
            var minuscules = sansChiffres.toLowerCase().trim();
            
            // 3. Mettre une majuscule au début de chaque mot
            var nomFormate = minuscules.replace(/\b[a-z]/g, function(lettre) {
                return lettre.toUpperCase();
            });
            
            // Nettoyage final des espaces multiples potentiels
            return nomFormate.replace(/\s+/g, ' ').trim();
        }

        // -------------------------------------------------------------
        // FONCTIONS DE COLORATION BASÉES SUR LES CODES COUCHE
        // -------------------------------------------------------------
        function getColorGlobal(valeur) {
            if (!valeur) return "#888888";
            var v = valeur.toString().trim().toLowerCase();
            if (v === "bon" || v === "bon état") return "#33bbff";          
            if (v === "moyen" || v === "état moyen") return "#ffd000";      
            if (v === "médiocre" || v === "médiocre état") return "#ff7700"; 
            if (v === "mauvais" || v === "mauvais état") return "#ff0000";   
            return "#888888"; 
        }

        function getColorEcologique(code) {
            if (!code) return "#888888";
            var c = code.toString().trim();
            if (c === "1") return "#0055ff"; 
            if (c === "2") return "#33bbff"; 
            if (c === "3") return "#ffd000"; 
            if (c === "4") return "#ff7700"; 
            if (c === "5") return "#ff0000"; 
            return "#888888";
        }

        function getColorChimique(code) {
            if (!code) return "#888888";
            var c = code.toString().trim().toUpperCase();
            if (c === "2") return "#33bbff"; 
            if (c === "U" || c === "3") return "#a020f0"; 
            return "#888888";
        }

        // Configuration de la carte centrée sur la zone
        var map = L.map('map').setView([48.4500, 6.2000], 9);

        var planIGN = L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; IGN'
        }).addTo(map);

        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');

        // Groupes Leaflet pour les territoires
        var coucheLimitesSL = L.layerGroup().addTo(map);
        var coucheSudMeuse = L.layerGroup().addTo(map);
        var coucheSud54 = L.layerGroup().addTo(map);
        var coucheVosgesOuest = L.layerGroup().addTo(map);
        var coucheSDDV = L.layerGroup().addTo(map);

        // Groupes Leaflet pour les modes de rendu des rivières
        var coucheCEQualiteGlobale = L.layerGroup(); 
        var coucheCEQualiteEcologique = L.layerGroup();
        var coucheCEQualiteChimique = L.layerGroup();

        var listeElementsCoursDeau = [];
        var optionQualiteActive = "aucune"; // Démarrage à blanc

        // 1. Chargement des enveloppes de territoires
        fetch('data/Limites SL.geojson').then(function(r){ return r.json(); }).then(function(data) {
            L.geoJSON(data, { style: { color: "#ffffff", weight: 3, dashArray: "6, 6", fillOpacity: 0 } }).addTo(coucheLimitesSL);
        }).catch(function(e){ console.error(e); });

        fetch('data/Plaque SudMeuse.geojson').then(function(r){ return r.json(); }).then(function(d) { L.geoJSON(d, { style: { color: '#e6194B', weight: 2, fillColor: '#e6194B', fillOpacity: 0.08 } }).addTo(coucheSudMeuse); }).catch(function(e){ console.error(e); });
        fetch('data/Plaque Sud54.geojson').then(function(r){ return r.json(); }).then(function(d) { L.geoJSON(d, { style: { color: '#3cb44b', weight: 2, fillColor: '#3cb44b', fillOpacity: 0.08 } }).addTo(coucheSud54); }).catch(function(e){ console.error(e); });
        fetch('data/Plaque Vosges Ouest.geojson').then(function(r){ return r.json(); }).then(function(d) { L.geoJSON(d, { style: { color: '#ffe119', weight: 2, fillColor: '#ffe119', fillOpacity: 0.08 } }).addTo(coucheVosgesOuest); }).catch(function(e){ console.error(e); });
        fetch('data/Plaque SDDV.geojson').then(function(r){ return r.json(); }).then(function(d) { L.geoJSON(d, { style: { color: '#4363d8', weight: 2, fillColor: '#4363d8', fillOpacity: 0.08 } }).addTo(coucheSDDV); }).catch(function(e){ console.error(e); });

        // 2. Chargement des 4 fichiers GEOJSON de rivières spécifiques
        function chargerFichierTerritoireCE(nomFichierGeojson, idCheckboxAsso) {
            fetch('data/' + nomFichierGeojson).then(function(r){ return r.json(); }).then(function(data) {
                
                var layerGlobale = L.geoJSON(data, {
                    style: function(f) { return { color: getColorGlobal(f.properties["Etat masse eau "]), weight: 3, opacity: document.getElementById('sldCEGlobale').value / 100 }; },
                    onEachFeature: genererPopup
                });
                
                var layerEcologique = L.geoJSON(data, {
                    style: function(f) { return { color: getColorEcologique(f.properties["_swEcologicalStatusOrPotentialValue"]), weight: 3, opacity: document.getElementById('sldCEEcologique').value / 100 }; },
                    onEachFeature: genererPopup
                });

                var layerChimique = L.geoJSON(data, {
                    style: function(f) { return { color: getColorChimique(f.properties["_swChemicalStatusValue"]), weight: 3, opacity: document.getElementById('sldCEChimique').value / 100 }; },
                    onEachFeature: genererPopup
                });

                layerGlobale._associatedCheckbox = idCheckboxAsso;
                layerEcologique._associatedCheckbox = idCheckboxAsso;
                layerChimique._associatedCheckbox = idCheckboxAsso;

                listeElementsCoursDeau.push({ globale: layerGlobale, ecologique: layerEcologique, chimique: layerChimique });
                
                actualiserVisibiliteRiviere();
            }).catch(function(err) { console.error("Erreur lors du chargement de " + nomFichierGeojson, err); });
        }

        // Appels vers vos fichiers spécifiques
        chargerFichierTerritoireCE('SudMeuse_Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson', 'chkSudMeuse');
        chargerFichierTerritoireCE('Sud54_Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson', 'chkSud54');
        chargerFichierTerritoireCE('Vosges_ouest_Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson', 'chkVosgesOuest');
        chargerFichierTerritoireCE('SDDV_Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson', 'chkSDDV');

        // Génération de la popup propre au clic
        function genererPopup(f, layer) {
            var nomNettoye = formaterNomCoursDeau(f.properties.NomMasseDEau);
            layer.bindPopup(`<h4>${nomNettoye}</h4>`);
        }

        // -------------------------------------------------------------
        // LOGIQUE D'INTERACTION DE L'INTERFACE UTILISATEUR
        // -------------------------------------------------------------
        var panel = document.getElementById('controlPanel');
        L.DomEvent.disableClickPropagation(panel);
        L.DomEvent.disableScrollPropagation(panel);

        function rafraichirOpaciteBasemap() {
            var alpha = document.getElementById('sldBasemap').value / 100;
            planIGN.setOpacity(alpha); osm.setOpacity(alpha);
        }
        document.getElementById('rbPlanIGN').addEventListener('change', function() { if(this.checked) { map.addLayer(planIGN); map.removeLayer(osm); rafraichirOpaciteBasemap(); } });
        document.getElementById('rbOSM').addEventListener('change', function() { if(this.checked) { map.addLayer(osm); map.removeLayer(planIGN); rafraichirOpaciteBasemap(); } });
        document.getElementById('sldBasemap').addEventListener('input', rafraichirOpaciteBasemap);

        function actualiserVisibiliteRiviere() {
            var toutSL = document.getElementById('chkLimitesSL').checked;

            listeElementsCoursDeau.forEach(function(item) {
                ['globale', 'ecologique', 'chimique'].forEach(function(mode) {
                    var sousCoucheGeojson = item[mode];
                    var cbId = sousCoucheGeojson._associatedCheckbox;
                    var checkboxTerritoireEstCochee = document.getElementById(cbId).checked;

                    if ((toutSL || checkboxTerritoireEstCochee) && optionQualiteActive === mode) {
                        if (mode === 'globale') coucheCEQualiteGlobale.addLayer(sousCoucheGeojson);
                        if (mode === 'ecologique') coucheCEQualiteEcologique.addLayer(sousCoucheGeojson);
                        if (mode === 'chimique') coucheCEQualiteChimique.addLayer(sousCoucheGeojson);
                    } else {
                        coucheCEQualiteGlobale.removeLayer(sousCoucheGeojson);
                        coucheCEQualiteEcologique.removeLayer(sousCoucheGeojson);
                        coucheCEQualiteChimique.removeLayer(sousCoucheGeojson);
                    }
                });
            });
        }

        // Événements Cases Territoires
        document.getElementById('chkLimitesSL').addEventListener('change', function() { 
            this.checked ? map.addLayer(coucheLimitesSL) : map.removeLayer(coucheLimitesSL); 
            actualiserVisibiliteRiviere(); 
        });
        document.getElementById('chkSudMeuse').addEventListener('change', function() { this.checked ? map.addLayer(coucheSudMeuse) : map.removeLayer(coucheSudMeuse); actualiserVisibiliteRiviere(); });
        document.getElementById('chkSud54').addEventListener('change', function() { this.checked ? map.addLayer(coucheSud54) : map.removeLayer(coucheSud54); actualiserVisibiliteRiviere(); });
        document.getElementById('chkVosgesOuest').addEventListener('change', function() { this.checked ? map.addLayer(coucheVosgesOuest) : map.removeLayer(coucheVosgesOuest); actualiserVisibiliteRiviere(); });
        document.getElementById('chkSDDV').addEventListener('change', function() { this.checked ? map.addLayer(coucheSDDV) : map.removeLayer(coucheSDDV); actualiserVisibiliteRiviere(); });

        // Événements Cases Qualités Exclusives et Décochables
        var listQualitesInputs = document.querySelectorAll('.chk-qualite');
        listQualitesInputs.forEach(function(checkbox) {
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    listQualitesInputs.forEach(function(autreCb) {
                        if (autreCb !== checkbox) autreCb.checked = false;
                    });
                    optionQualiteActive = this.value;
                } else {
                    optionQualiteActive = "aucune";
                }
                basculerAffichageGroupeQualite();
            });
        });

        function basculerAffichageGroupeQualite() {
            map.removeLayer(coucheCEQualiteGlobale); 
            map.removeLayer(coucheCEQualiteEcologique); 
            map.removeLayer(coucheCEQualiteChimique);
            
            if (optionQualiteActive === "globale") map.addLayer(coucheCEQualiteGlobale);
            if (optionQualiteActive === "ecologique") map.addLayer(coucheCEQualiteEcologique);
            if (optionQualiteActive === "chimique") map.addLayer(coucheCEQualiteChimique);
            
            actualiserVisibiliteRiviere();
            legende.update();
        }

        // Sliders d'opacités
        function appliquerOpaciteRiviere(mode, pourcent) {
            listeElementsCoursDeau.forEach(function(item) {
                item[mode].setStyle({ opacity: pourcent / 100 });
            });
        }
        document.getElementById('sldCEGlobale').addEventListener('input', function() { appliquerOpaciteRiviere('globale', this.value); });
        document.getElementById('sldCEEcologique').addEventListener('input', function() { appliquerOpaciteRiviere('ecologique', this.value); });
        document.getElementById('sldCEChimique').addEventListener('input', function() { appliquerOpaciteRiviere('chimique', this.value); });

        // Légende dynamique
        var legende = L.control({ position: 'bottomright' });
        legende.onAdd = function (map) { this._div = L.DomUtil.create('div', 'info legend'); this.update(); return this._div; };
        legende.update = function () {
            var typeQualite = "", items = [];
            
            if (optionQualiteActive === "globale") {
                typeQualite = "Qualité Globale";
                items = [{ label: "Bon / Très Bon", color: "#33bbff" }, { label: "Moyen", color: "#ffd000" }, { label: "Médiocre", color: "#ff7700" }, { label: "Mauvais", color: "#ff0000" }, { label: "Inconnu", color: "#888888" }];
            } else if (optionQualiteActive === "ecologique") {
                typeQualite = "Qualité Écologique";
                items = [{ label: "Très bon", color: "#0055ff" }, { label: "Bon", color: "#33bbff" }, { label: "Moyen", color: "#ffd000" }, { label: "Médiocre", color: "#ff7700" }, { label: "Mauvais", color: "#ff0000" }, { label: "Inconnu", color: "#888888" }];
            } else if (optionQualiteActive === "chimique") {
                typeQualite = "Qualité Chimique";
                items = [{ label: "Bon", color: "#33bbff" }, { label: "Non atteint / Médiocre", color: "#a020f0" }, { label: "Inconnu", color: "#888888" }];
            }
            
            if (!typeQualite || optionQualiteActive === "aucune") { this._div.style.display = 'none'; return; }
            this._div.style.display = 'block';
            var htmlContenu = `<h4>${typeQualite}</h4>`;
            items.forEach(function(item) { htmlContenu += `<i style="background: ${item.color}"></i> ${item.label}<br>`; });
            this._div.innerHTML = htmlContenu;
        };
        legende.addTo(map);
    </script>
</body>
</html>
