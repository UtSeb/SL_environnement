<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        /* Reset et plein écran */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212; /* Mode sombre */
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* Style fenêtres popups */
        .leaflet-popup-content h4 {
            margin: 0 0 8px 0;
            color: #3388ff;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        .leaflet-popup-content ul {
            padding-left: 15px;
            margin: 5px 0;
        }
        
        /* Menu de contrôle latéral structuré (Style Sombre Pro) */
        .custom-layer-control {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #222222;
            color: #ffffff;
            border: 2px solid #444444;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            width: 250px;
            max-height: 85vh;
            overflow-y: auto;
        }

        /* Style des menus à tiroirs (Details/Summary natifs HTML5) */
        .tiroir-menu {
            margin-top: 8px;
        }
        .tiroir-menu summary {
            font-weight: bold;
            color: #00ffcc;
            cursor: pointer;
            padding: 6px 0;
            border-bottom: 1px solid #444;
            outline: none;
            user-select: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .tiroir-contenu {
            padding: 6px 4px 4px 8px;
        }
        .tiroir-contenu label {
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .tiroir-contenu input {
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Titre fixe hors tiroir pour le fond de carte */
        .titre-fond-carte {
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
        }

        /* Style de la Légende Dynamique */
        .info.legend {
            background: #222222;
            color: #ffffff;
            padding: 12px;
            border: 2px solid #444444;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            line-height: 18px;
        }
        .info.legend h4 {
            margin: 0 0 8px 0;
            color: #00ffcc;
            font-size: 14px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        .legend i {
            width: 18px;
            height: 6px;
            float: left;
            margin-right: 8px;
            margin-top: 6px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="controlPanel" class="custom-layer-control">
        <span class="titre-fond-carte">Fond de carte</span>
        <div style="padding-left: 8px; margin-bottom: 10px;">
            <label><input type="radio" name="basemap" id="rbPlanIGN" checked> Plan IGN (Officiel)</label>
            <label><input type="radio" name="basemap" id="rbOSM"> OpenStreetMap</label>
        </div>

        <details class="tiroir-menu" open>
            <summary>Périmètre</summary>
            <div class="tiroir-contenu">
                <label><input type="checkbox" id="chkLimitesSL" checked> Limites Sud-Lorraine</label>
            </div>
        </details>

        <details class="tiroir-menu" open>
            <summary>Territoires</summary>
            <div class="tiroir-contenu">
                <label><input type="checkbox" id="chkSudMeuse" checked> Sud Meuse</label>
                <label><input type="checkbox" id="chkSud54" checked> Sud 54</label>
                <label><input type="checkbox" id="chkVosgesOuest" checked> Vosges Ouest</label>
                <label><input type="checkbox" id="chkSDDV" checked> Saint-Dié (SDDV)</label>
            </div>
        </details>

        <details class="tiroir-menu" open>
            <summary>Cours d'eau</summary>
            <div class="tiroir-contenu">
                <label><input type="radio" name="qualiteCE" id="rbCEGlobale" checked> Qualité globale</label>
                <label><input type="radio" name="qualiteCE" id="rbCEEcologique"> Qualité écologique</label>
                <label><input type="radio" name="qualiteCE" id="rbCEChimique"> Qualité chimique</label>
                <label style="color: #aaa; margin-top: 5px;"><input type="radio" name="qualiteCE" id="rbCENone"> Masquer les cours d'eau</label>
            </div>
        </details>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // -------------------------------------------------------------
        // FONCTION DE REPROJECTION LAMBERT-93 (EPSG:2154) -> WGS84 (EPSG:4326)
        // -------------------------------------------------------------
        function reprojectLambert93ToWGS84(coords) {
            const X = coords[0]; const Y = coords[1];
            const c = 11754255.426; const n = 0.725607765053267;
            const xs = 700000; const ys = 12655612.0493776; const e = 0.0818191910428158;
            const dx = X - xs; const dy = Y - ys;
            const R = Math.sqrt(dx * dx + dy * dy); const gamma = Math.atan(dx / -dy);
            const latIso = Math.log(c / R) / n;
            let lat = 2 * Math.atan(Math.exp(latIso)) - Math.PI / 2;
            for (let i = 0; i < 5; i++) {
                const sinLat = Math.sin(lat);
                lat = 2 * Math.atan(Math.pow((1 + e * sinLat) / (1 - e * sinLat), e / 2) * Math.exp(latIso)) - Math.PI / 2;
            }
            const lon = gamma / n + (3 * Math.PI / 180);
            return [lon * 180 / Math.PI, lat * 180 / Math.PI];
        }

        function fixGeoJSONProjection(geojson) {
            if (!geojson || !geojson.crs || !geojson.crs.properties || !geojson.crs.properties.name.includes("2154")) return geojson;
            const transformCoords = (coords, type) => {
                if (type === "Point") return reprojectLambert93ToWGS84(coords);
                if (type === "LineString" || type === "MultiPoint") return coords.map(reprojectLambert93ToWGS84);
                if (type === "Polygon" || type === "MultiLineString") return coords.map(ring => ring.map(reprojectLambert93ToWGS84));
                if (type === "MultiPolygon") return coords.map(poly => poly.map(ring => ring.map(reprojectLambert93ToWGS84)));
                return coords;
            };
            geojson.features.forEach(feature => {
                if (feature.geometry) feature.geometry.coordinates = transformCoords(feature.geometry.coordinates, feature.geometry.type);
            });
            return geojson;
        }

        // -------------------------------------------------------------
        // FONCTION DE COLORATION DE LA QUALITÉ
        // -------------------------------------------------------------
        function getColorByQuality(valeur) {
            if (!valeur) return "#888888";
            const v = valeur.trim().toLowerCase();
            
            if (v === "très bon" || v === "très bon état") return "#0055ff"; 
            if (v === "bon" || v === "bon état") return "#33bbff";          
            if (v === "moyen" || v === "état moyen") return "#ffd000";      
            if (v === "médiocre" || v === "médiocre état") return "#ff7700"; 
            if (v === "mauvais" || v === "mauvais état") return "#ff0000";   
            if (v === "non atteint") return "#a020f0";                       
            return "#888888"; 
        }

        // -------------------------------------------------------------
        // INITIALISATION DE LA CARTE
        // -------------------------------------------------------------
        const map = L.map('map').setView([48.5000, 6.2000], 8.5);

        // Instanciation des fonds de carte
        const planIGN = L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; IGN'
        }).addTo(map);

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        });

        // Instanciation des Groupes de couches de données
        const coucheLimitesSL = L.layerGroup().addTo(map);
        const coucheSudMeuse = L.layerGroup().addTo(map);
        const coucheSud54 = L.layerGroup().addTo(map);
        const coucheVosgesOuest = L.layerGroup().addTo(map);
        const coucheSDDV = L.layerGroup().addTo(map);

        const coucheCEQualiteGlobale = L.layerGroup().addTo(map); // Activé par défaut
        const coucheCEQualiteEcologique = L.layerGroup();
        const coucheCEQualiteChimique = L.layerGroup();

        // -------------------------------------------------------------
        // CHARGEMENT DES DONNÉES GEOJSON
        // -------------------------------------------------------------
        fetch('data/Limites SL.geojson').then(r => r.json()).then(data => {
            L.geoJSON(fixGeoJSONProjection(data), { style: { color: "#ff3333", weight: 3.5, fillOpacity: 0, dashArray: "6, 12" } }).addTo(coucheLimitesSL);
        });

        fetch('data/Plaque SudMeuse.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#e6194B', weight: 2, fillColor: '#e6194B', fillOpacity: 0.1 } }).addTo(coucheSudMeuse);
        });
        fetch('data/Plaque Sud54.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#3cb44b', weight: 2, fillColor: '#3cb44b', fillOpacity: 0.1 } }).addTo(coucheSud54);
        });
        fetch('data/Plaque Vosges Ouest.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#ffe119', weight: 2, fillColor: '#ffe119', fillOpacity: 0.1 } }).addTo(coucheVosgesOuest);
        });
        fetch('data/Plaque SDDV.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#4363d8', weight: 2, fillColor: '#4363d8', fillOpacity: 0.1 } }).addTo(coucheSDDV);
        });

        fetch('data/Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson').then(r => r.json()).then(data => {
            L.geoJSON(data, {
                style: function(f) { return { color: getColorByQuality(f.properties["Etat masse eau "]), weight: 2.5, opacity: 0.85 }; },
                onEachFeature: genererPopup
            }).addTo(coucheCEQualiteGlobale);

            L.geoJSON(data, {
                style: function(f) { return { color: getColorByQuality(f.properties["Etat ecologique"]), weight: 2.5, opacity: 0.85 }; },
                onEachFeature: genererPopup
            }).addTo(coucheCEQualiteEcologique);

            L.geoJSON(data, {
                style: function(f) { return { color: getColorByQuality(f.properties["Etat chimique"]), weight: 2.5, opacity: 0.85 }; },
                onEachFeature: genererPopup
            }).addTo(coucheCEQualiteChimique);
        });

        function genererPopup(f, layer) {
            const props = f.properties;
            layer.bindPopup(`
                <h4>${props.NomMasseDEau || "Inconnu"}</h4>
                <ul>
                    <li><b>Qualité Globale :</b> ${props["Etat masse eau "] || "Non renseigné"}</li>
                    <li><b>Qualité Écologique :</b> ${props["Etat ecologique"] || "Non renseigné"}</li>
                    <li><b>Qualité Chimique :</b> ${props["Etat chimique"] || "Non renseigné"}</li>
                </ul>
            `);
        }

        // -------------------------------------------------------------
        // GESTIONNAIRE D'ÉVÉNEMENTS DU PANNEAU (BASCULEMENTS DIRECTS ET NETS)
        // -------------------------------------------------------------
        const panel = document.getElementById('controlPanel');
        L.DomEvent.disableClickPropagation(panel);
        L.DomEvent.disableScrollPropagation(panel);

        // Gestion des Fonds de carte
        document.getElementById('rbPlanIGN').addEventListener('change', function() { if(this.checked) { map.addLayer(planIGN); map.removeLayer(osm); } });
        document.getElementById('rbOSM').addEventListener('change', function() { if(this.checked) { map.addLayer(osm); map.removeLayer(planIGN); } });

        // Gestion des Périmètres et Territoires
        document.getElementById('chkLimitesSL').addEventListener('change', function() { this.checked ? map.addLayer(coucheLimitesSL) : map.removeLayer(coucheLimitesSL); });
        document.getElementById('chkSudMeuse').addEventListener('change', function() { this.checked ? map.addLayer(coucheSudMeuse) : map.removeLayer(coucheSudMeuse); });
        document.getElementById('chkSud54').addEventListener('change', function() { this.checked ? map.addLayer(coucheSud54) : map.removeLayer(coucheSud54); });
        document.getElementById('chkVosgesOuest').addEventListener('change', function() { this.checked ? map.addLayer(coucheVosgesOuest) : map.removeLayer(coucheVosgesOuest); });
        document.getElementById('chkSDDV').addEventListener('change', function() { this.checked ? map.addLayer(coucheSDDV) : map.removeLayer(coucheSDDV); });

        // LOGIQUE D'EXCLUSION INSTANTANÉE (Décoche et efface en 1 clic sans double manipulation)
        function basculerQualiteEau() {
            // Nettoyage complet préalable des couches sur la carte
            map.removeLayer(coucheCEQualiteGlobale);
            map.removeLayer(coucheCEQualiteEcologique);
            map.removeLayer(coucheCEQualiteChimique);

            // Activation de la couche unique demandée
            if (document.getElementById('rbCEGlobale').checked) map.addLayer(coucheCEQualiteGlobale);
            if (document.getElementById('rbCEEcologique').checked) map.addLayer(coucheCEQualiteEcologique);
            if (document.getElementById('rbCEChimique').checked) map.addLayer(coucheCEQualiteChimique);
            
            legende.update(); // Synchronisation de la légende
        }

        document.getElementById('rbCEGlobale').addEventListener('change', basculerQualiteEau);
        document.getElementById('rbCEEcologique').addEventListener('change', basculerQualiteEau);
        document.getElementById('rbCEChimique').addEventListener('change', basculerQualiteEau);
        document.getElementById('rbCENone').addEventListener('change', basculerQualiteEau);

        // -------------------------------------------------------------
        // CRÉATION DE LA LÉGENDE DYNAMIQUE
        // -------------------------------------------------------------
        const legende = L.control({ position: 'bottomright' });

        legende.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info legend');
            this.update();
            return this._div;
        };

        legende.update = function () {
            let typeQualite = "";
            let items = [];

            if (map.hasLayer(coucheCEQualiteGlobale)) {
                typeQualite = "Qualité Globale";
                items = [
                    { label: "Bon", color: "#33bbff" },
                    { label: "Moyen", color: "#ffd000" },
                    { label: "Médiocre", color: "#ff7700" },
                    { label: "Mauvais", color: "#ff0000" },
                    { label: "Inconnu", color: "#888888" }
                ];
            } else if (map.hasLayer(coucheCEQualiteEcologique)) {
                typeQualite = "Qualité Écologique";
                items = [
                    { label: "Très bon", color: "#0055ff" },
                    { label: "Bon", color: "#33bbff" },
                    { label: "Moyen", color: "#ffd000" },
                    { label: "Médiocre", color: "#ff7700" },
                    { label: "Mauvais", color: "#ff0000" }
                ];
            } else if (map.hasLayer(coucheCEQualiteChimique)) {
                typeQualite = "Qualité Chimique";
                items = [
                    { label: "Bon", color: "#33bbff" },
                    { label: "Non atteint", color: "#a020f0" },
                    { label: "Inconnu", color: "#888888" }
                ];
            }

            if (!typeQualite) {
                this._div.style.display = 'none';
                return;
            }
            
            this._div.style.display = 'block';
            let htmlContenu = `<h4>${typeQualite}</h4>`;
            items.forEach(item => {
                htmlContenu += `<i style="background: ${item.color}"></i> ${item.label}<br>`;
            });
            this._div.innerHTML = htmlContenu;
        };

        legende.addTo(map);
    </script>
</body>
</html>
