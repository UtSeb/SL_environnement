<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        /* Reset et plein écran */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212; /* Mode sombre par défaut pour l'interface */
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* Style personnalisé pour les popups */
        .leaflet-popup-content-value {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Initialisation de la carte centrée sur la Lorraine
        const map = L.map('map').setView([48.5000, 6.2000], 8.5);

        // 2. Définition des fonds de carte
        const planIGN = L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; <a href="https://www.ign.fr/">IGN</a>',
            minZoom: 0,
            maxZoom: 19
        }).addTo(map); // Activé par défaut

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // 3. Création des groupes de couches (LayerGroups) pour accueillir les GeoJSON
        const coucheLimitesSL = L.layerGroup().addTo(map); // Activé par défaut
        const coucheTerritoires = L.layerGroup().addTo(map); // Activé par défaut
        const coucheCoursDEau = L.layerGroup().addTo(map); // Activé par défaut

        // 4. Styles pour les entités vectorielles

        // Style des limites globales du Sud-Lorraine
        const styleLimitesSL = {
            color: "#ff3333",
            weight: 3,
            fillOpacity: 0,
            dashArray: "5, 10"
        };

        // Fonction de style pour différencier les 4 territoires (plaques)
        function styleTerritoires(feature) {
            // Attribution d'une couleur aléatoire ou fixe par territoire si un champ nom existe.
            // Par défaut, on applique une couleur selon le fichier. Ici on applique un style global transparent avec bordure fine.
            return {
                color: "#ffffff",
                weight: 1.5,
                fillColor: "#00ffcc",
                fillOpacity: 0.15
            };
        }

        // Style des cours d'eau
        const styleCoursDEau = {
            color: "#3388ff",
            weight: 2,
            opacity: 0.8
        };

        // 5. Chargement des fichiers GeoJSON via l'API Fetch

        // Chargement 1 : Limites Sud-Lorraine
        fetch('data/Limites SL.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: styleLimitesSL
                }).addTo(coucheLimitesSL);
            })
            .catch(error => console.error("Erreur de chargement du fichier Limites SL :", error));

        // Chargement 2 : Les 4 territoires (Plaques)
        const fichiersTerritoires = [
            { chemin: 'data/Plaque SudMeuse.geojson', couleur: '#e6194B' },
            { chemin: 'data/Plaque Sud54.geojson', couleur: '#3cb44b' },
            { chemin: 'data/Plaque Vosges Ouest.geojson', couleur: '#ffe119' },
            { chemin: 'data/Plaque SDDV.geojson', couleur: '#4363d8' }
        ];

        fichiersTerritoires.forEach(t => {
            fetch(t.chemin)
                .then(response => response.json())
                .then(data => {
                    L.geoJSON(data, {
                        style: {
                            color: t.couleur,
                            weight: 2,
                            fillColor: t.couleur,
                            fillOpacity: 0.1
                        }
                    }).addTo(coucheTerritoires);
                })
                .catch(error => console.error("Erreur de chargement de " + t.chemin + " :", error));
        });

        // Chargement 3 : Cours d'eau et leurs attributs de qualité
        fetch('data/Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: styleCoursDEau,
                    onEachFeature: function (feature, layer) {
                        // Récupération des attributs (ajuste les clés si tes colonnes diffèrent dans ton SIG)
                        const props = feature.properties;
                        let popupContenu = `<h4>Cours d'eau</h4>`;
                        
                        // Détection automatique des attributs disponibles pour la popup
                        if (props.nom_masse_eau || props.NOM_COURS_DEAU || props.nom) {
                            popupContenu += `<b>Nom :</b> ${props.nom_masse_eau || props.NOM_COURS_DEAU || props.nom}<br>`;
                        }
                        
                        popupContenu += `<ul>`;
                        if (props.etat_general || props.ETAT_GEN) popupContenu += `<li><b>État Général :</b> ${props.etat_general || props.ETAT_GEN}</li>`;
                        if (props.etat_ecologique || props.ECO_STAT) popupContenu += `<li><b>État Écologique :</b> ${props.etat_ecologique || props.ECO_STAT}</li>`;
                        if (props.etat_chimique || props.CHIM_STAT) popupContenu += `<li><b>État Chimique :</b> ${props.etat_chimique || props.CHIM_STAT}</li>`;
                        popupContenu += `</ul>`;
                        
                        layer.bindPopup(popupContenu);
                    }
                }).addTo(coucheCoursDEau);
            })
            .catch(error => console.error("Erreur de chargement des cours d'eau :", error));


        // 6. Gestionnaire de couches (Contrôle d'affichage de l'interface)
        const baseMaps = {
            "Plan IGN (Officiel)": planIGN,
            "OpenStreetMap": osm
        };

        const overlayMaps = {
            "Limites Sud-Lorraine": coucheLimitesSL,
            "Les 4 Territoires": coucheTerritoires,
            "Cours d'eau (Qualité)": coucheCoursDEau
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
    </script>
</body>
</html>
