<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodiversité — Sud Lorraine</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .leaflet-popup-content h4 {
            margin: 0 0 8px 0;
            color: #3388ff;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        .leaflet-popup-content ul {
            padding-left: 15px;
            margin: 5px 0;
        }
        
        /* Panneau de contrôle style sombre */
        .custom-layer-control {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: #222222;
            color: #ffffff;
            border: 2px solid #444444;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            width: 260px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .tiroir-menu {
            margin-top: 8px;
        }
        .tiroir-menu summary {
            font-weight: bold;
            color: #00ffcc;
            cursor: pointer;
            padding: 6px 0;
            border-bottom: 1px solid #444;
            outline: none;
            user-select: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .tiroir-contenu {
            padding: 8px 4px 4px 4px;
        }
        .item-couche {
            margin-bottom: 10px;
        }
        .item-couche label {
            display: block;
            cursor: pointer;
            white-space: nowrap;
            margin-bottom: 2px;
        }
        .item-couche input[type="checkbox"], 
        .item-couche input[type="radio"] {
            margin-right: 8px;
            vertical-align: middle;
        }
        .slider-opacite {
            display: block;
            width: 90%;
            margin: 2px 0 0 22px;
            height: 4px;
            background: #444;
            outline: none;
            accent-color: #00ffcc;
            cursor: pointer;
        }
        .bloc-fonds {
            padding-left: 4px;
            margin-bottom: 10px;
        }
        .bloc-fonds label {
            display: block;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .bloc-fonds input[type="radio"] {
            margin-right: 8px;
            vertical-align: middle;
        }
        .bloc-fonds .slider-opacite {
            margin-left: 4px;
            width: 95%;
        }
        .decalage-sous-couche {
            padding-left: 18px; 
        }
        .titre-fond-carte {
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
        }
        .info.legend {
            background: #222222;
            color: #ffffff;
            padding: 12px;
            border: 2px solid #444444;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            line-height: 18px;
        }
        .info.legend h4 {
            margin: 0 0 8px 0;
            color: #00ffcc;
            font-size: 14px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        .legend i {
            width: 18px;
            height: 6px;
            float: left;
            margin-right: 8px;
            margin-top: 6px;
            border-radius: 2px;
        }
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
            font-size: 16px;
            gap: 12px;
        }
        #loading-overlay .spinner {
            width: 40px; height: 40px;
            border: 4px solid #444;
            border-top-color: #00ffcc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <span>Chargement et découpe des cours d'eau…</span>
    </div>

    <div id="map"></div>

    <div id="controlPanel" class="custom-layer-control">
        <span class="titre-fond-carte">Fond de carte</span>
        <div class="bloc-fonds">
            <label><input type="radio" name="basemap" id="rbPlanIGN" checked>Plan IGN (Officiel)</label>
            <label><input type="radio" name="basemap" id="rbOSM">OpenStreetMap</label>
            <input type="range" class="slider-opacite" id="sldBasemap" min="0" max="100" value="100">
        </div>

        <details class="tiroir-menu" open>
            <summary>Territoires</summary>
            <div class="tiroir-contenu">
                <div class="item-couche">
                    <label><input type="checkbox" id="chkLimitesSL" checked>Limites Sud-Lorraine</label>
                    <input type="range" class="slider-opacite" id="sldLimitesSL" min="0" max="100" value="100">
                </div>
                <div class="decalage-sous-couche">
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSudMeuse" checked>Sud Meuse</label>
                        <input type="range" class="slider-opacite" id="sldSudMeuse" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSud54" checked>Sud 54</label>
                        <input type="range" class="slider-opacite" id="sldSud54" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkVosgesOuest" checked>Vosges Ouest</label>
                        <input type="range" class="slider-opacite" id="sldVosgesOuest" min="0" max="100" value="100">
                    </div>
                    <div class="item-couche">
                        <label><input type="checkbox" id="chkSDDV" checked>Saint-Dié (SDDV)</label>
                        <input type="range" class="slider-opacite" id="sldSDDV" min="0" max="100" value="100">
                    </div>
                </div>
            </div>
        </details>

        <details class="tiroir-menu" open>
            <summary>Cours d'eau</summary>
            <div class="tiroir-contenu">
                <div class="item-couche">
                    <label><input type="radio" name="qualiteCE" id="rbCEGlobale" value="globale" checked>Qualité globale</label>
                    <input type="range" class="slider-opacite" id="sldCEGlobale" min="0" max="100" value="85">
                </div>
                <div class="item-couche">
                    <label><input type="radio" name="qualiteCE" id="rbCEEcologique" value="ecologique">Qualité écologique</label>
                    <input type="range" class="slider-opacite" id="sldCEEcologique" min="0" max="100" value="85">
                </div>
                <div class="item-couche">
                    <label><input type="radio" name="qualiteCE" id="rbCEChimique" value="chimique">Qualité chimique</label>
                    <input type="range" class="slider-opacite" id="sldCEChimique" min="0" max="100" value="85">
                </div>
            </div>
        </details>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
    // ================================================================
    // PARSEUR COULEUR PAR QUALITÉ
    // ================================================================
    function getColorByQuality(valeur) {
        if (!valeur) return "#888888";
        const v = valeur.toString().trim().toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // supprime accents pour comparaison robuste
        if (v === "tres bon" || v === "tres bon etat" || v === "1") return "#0055ff";
        if (v === "bon" || v === "bon etat" || v === "2")            return "#33bbff";
        if (v === "moyen" || v === "etat moyen" || v === "3")        return "#ffd000";
        if (v === "mediocre" || v === "etat mediocre" || v === "4") return "#ff7700";
        if (v === "mauvais" || v === "mauvais etat" || v === "5")    return "#ff0000";
        if (v === "non atteint" || v === "pas bon" || v === "3")     return "#a020f0";
        return "#888888"; // Inconnu
    }

    // ================================================================
    // INITIALISATION CARTE
    // ================================================================
    const map = L.map('map').setView([48.4500, 6.2000], 9);

    const planIGN = L.tileLayer(
        'https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
        { attribution: '&copy; IGN' }
    ).addTo(map);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    });

    // ================================================================
    // GROUPES LEAFLET
    // ================================================================
    const coucheLimitesSL    = L.layerGroup().addTo(map);
    const coucheSudMeuse     = L.layerGroup().addTo(map);
    const coucheSud54        = L.layerGroup().addTo(map);
    const coucheVosgesOuest  = L.layerGroup().addTo(map);
    const coucheSDDV         = L.layerGroup().addTo(map);

    const coucheCEGlobale    = L.layerGroup().addTo(map);
    const coucheCEEcologique = L.layerGroup();
    const coucheCEChimique   = L.layerGroup();

    let geojsonLimitesSL, geojsonSudMeuse, geojsonSud54, geojsonVosgesOuest, geojsonSDDV;
    let leafletCEGlobale, leafletCEEcologique, leafletCEChimique;

    // ================================================================
    // STOCKAGE DES DONNÉES BRUTES ET DÉCOUPÉES
    // ================================================================
    // segmentsParTerritoire[nomKey] = tableau de features (LineString)
    // avec toutes les propriétés originales conservées
    let segmentsParTerritoire = {};
    let terrainsCharges = {};   // booléens de chargement
    let rawMassesEaux = null;

    // Noms clés internes identiques aux clés de terrainsCharges
    const TERRITOIRES = {
        "Sud Meuse":    { color: '#e6194B', checkId: 'chkSudMeuse',    sldId: 'sldSudMeuse' },
        "Sud54":        { color: '#3cb44b', checkId: 'chkSud54',       sldId: 'sldSud54' },
        "Vosges Ouest": { color: '#ffe119', checkId: 'chkVosgesOuest', sldId: 'sldVosgesOuest' },
        "SDDV":         { color: '#4363d8', checkId: 'chkSDDV',        sldId: 'sldSDDV' }
    };

    // ================================================================
    // CHARGEMENT DES DONNÉES
    // ================================================================
    function chargerGeoJSON(url) {
        return fetch(url).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status} pour ${url}`);
            return r.json();
        });
    }

    // Helper : normalise un GeoJSON feature/collection vers un tableau de Feature<Polygon>
    function extrairePolygons(geojsonData) {
        const polygons = [];
        const features = geojsonData.features || [geojsonData];
        features.forEach(f => {
            if (!f.geometry) return;
            if (f.geometry.type === "Polygon") {
                polygons.push(f);
            } else if (f.geometry.type === "MultiPolygon") {
                // Éclate le MultiPolygon en Polygons simples pour turf
                f.geometry.coordinates.forEach(coords => {
                    polygons.push({
                        type: "Feature",
                        properties: f.properties,
                        geometry: { type: "Polygon", coordinates: coords }
                    });
                });
            }
        });
        return polygons;
    }

    // ================================================================
    // CLIP ROBUSTE DES COURS D'EAU — MÉTHODE MIDPOINT PAR SEGMENT
    // ================================================================
    // Explication de la méthode :
    //   1. On décompose chaque MultiLineString en LineString simples
    //   2. On décompose chaque LineString en petits segments de 2 points
    //   3. On calcule le midpoint de chaque segment
    //   4. On teste si ce midpoint est dans l'un des polygones du territoire
    //   5. Si oui → ce segment est dans le territoire → on le conserve
    //   6. On regroupe les segments contigus conservés en LineString
    //   Cette approche évite totalement turf.lineSplit (incompatible MultiLineString)
    //   et donne un clip pixel-perfect sans erreur de topologie.
    // ================================================================

    function clipMasseEauxParTerritoire(rawData, polygonsParTerritoire) {
        // polygonsParTerritoire = { "Sud54": [Feature<Polygon>, ...], ... }
        segmentsParTerritoire = {};

        Object.keys(polygonsParTerritoire).forEach(nomKey => {
            segmentsParTerritoire[nomKey] = [];
        });

        rawData.features.forEach(feature => {
            if (!feature.geometry) return;

            // Normalise en tableau de tableaux de coordonnées (une par sous-ligne)
            let sousLignes = [];
            if (feature.geometry.type === "LineString") {
                sousLignes = [feature.geometry.coordinates];
            } else if (feature.geometry.type === "MultiLineString") {
                sousLignes = feature.geometry.coordinates;
            } else {
                return; // on ignore les autres types (Point, Polygon…)
            }

            Object.keys(polygonsParTerritoire).forEach(nomKey => {
                const polygons = polygonsParTerritoire[nomKey];
                const segmentsConserves = [];

                sousLignes.forEach(coords => {
                    if (coords.length < 2) return;

                    // Accumulation de segments consécutifs qui sont dans le territoire
                    let segmentCourant = null;

                    for (let i = 0; i < coords.length - 1; i++) {
                        const ptA = coords[i];
                        const ptB = coords[i + 1];

                        // Midpoint du petit segment
                        const mid = turf.midpoint(
                            turf.point(ptA),
                            turf.point(ptB)
                        );

                        // Le midpoint est-il dans l'un des polygones du territoire ?
                        const dansTerritoire = polygons.some(poly =>
                            turf.booleanPointInPolygon(mid, poly)
                        );

                        if (dansTerritoire) {
                            if (!segmentCourant) {
                                // Début d'un nouveau tronçon
                                segmentCourant = [ptA, ptB];
                            } else {
                                // On étend le tronçon courant
                                segmentCourant.push(ptB);
                            }
                        } else {
                            if (segmentCourant && segmentCourant.length >= 2) {
                                segmentsConserves.push(segmentCourant);
                            }
                            segmentCourant = null;
                        }
                    }
                    // Flush du dernier tronçon ouvert
                    if (segmentCourant && segmentCourant.length >= 2) {
                        segmentsConserves.push(segmentCourant);
                    }
                });

                // Si on a trouvé au moins un tronçon dans ce territoire
                if (segmentsConserves.length > 0) {
                    const newFeature = {
                        type: "Feature",
                        properties: Object.assign({}, feature.properties, { _territoire: nomKey }),
                        geometry: {
                            type: "MultiLineString",
                            coordinates: segmentsConserves
                        }
                    };
                    segmentsParTerritoire[nomKey].push(newFeature);
                }
            });
        });

        console.log("Clip terminé. Segments par territoire :");
        Object.keys(segmentsParTerritoire).forEach(k =>
            console.log(`  ${k}: ${segmentsParTerritoire[k].length} masses d'eau`)
        );
    }

    // ================================================================
    // INITIALISATION — CHARGEMENT PARALLÈLE DE TOUTES LES COUCHES
    // ================================================================
    let polygonsParTerritoire = {};
    let compteurChargement = 0;
    const TOTAL_CHARGES = 6; // 4 plaques + 1 limites + 1 masses eaux

    function onCoucheChargee() {
        compteurChargement++;
        if (compteurChargement === TOTAL_CHARGES) {
            // Tout est chargé → on lance le clip (opération lourde, ~0.5s)
            clipMasseEauxParTerritoire(rawMassesEaux, polygonsParTerritoire);
            filtrerEtAfficherCoursDeau();
            document.getElementById('loading-overlay').style.display = 'none';
        }
    }

    // Limites générales
    chargerGeoJSON('data/Limites_SL.geojson').then(data => {
        geojsonLimitesSL = L.geoJSON(data, {
            style: { color: "#ffffff", weight: 3, dashArray: "6, 6", fillOpacity: 0 }
        }).addTo(coucheLimitesSL);
        onCoucheChargee();
    }).catch(e => console.error("Erreur Limites_SL:", e));

    // Plaques territoriales
    const configPlaques = [
        { fichier: 'Plaque_SudMeuse.geojson',    nomKey: 'Sud Meuse',    leafletVar: 'geojsonSudMeuse',    couche: coucheSudMeuse },
        { fichier: 'Plaque_Sud54.geojson',        nomKey: 'Sud54',        leafletVar: 'geojsonSud54',       couche: coucheSud54 },
        { fichier: 'Plaque_Vosges_Ouest.geojson', nomKey: 'Vosges Ouest', leafletVar: 'geojsonVosgesOuest', couche: coucheVosgesOuest },
        { fichier: 'Plaque_SDDV.geojson',         nomKey: 'SDDV',         leafletVar: 'geojsonSDDV',        couche: coucheSDDV },
    ];
    const leafletPlaquesRefs = {};

    configPlaques.forEach(cfg => {
        chargerGeoJSON(`data/${cfg.fichier}`).then(data => {
            // Stockage des polygons pour le clip
            polygonsParTerritoire[cfg.nomKey] = extrairePolygons(data);

            // Affichage Leaflet
            const couleur = TERRITOIRES[cfg.nomKey].color;
            leafletPlaquesRefs[cfg.nomKey] = L.geoJSON(data, {
                style: { color: couleur, weight: 2, fillColor: couleur, fillOpacity: 0.08 }
            }).addTo(cfg.couche);

            onCoucheChargee();
        }).catch(e => console.error(`Erreur ${cfg.fichier}:`, e));
    });

    // Masses d'eau
    chargerGeoJSON('data/Etats_general_-_ecologique_-_chimique_-_masses_eaux_Sl-alleger.geojson').then(data => {
        rawMassesEaux = data;
        onCoucheChargee();
    }).catch(e => console.error("Erreur masses eaux:", e));

    // ================================================================
    // FILTRAGE ET RENDU — appelé après chaque changement de checkbox
    // ================================================================
    let optionQualiteActive = "globale";

    function filtrerEtAfficherCoursDeau() {
        if (!rawMassesEaux || Object.keys(segmentsParTerritoire).length === 0) return;

        coucheCEGlobale.clearLayers();
        coucheCEEcologique.clearLayers();
        coucheCEChimique.clearLayers();

        // On détermine quels territoires sont actifs
        const toutSudLorraine = document.getElementById('chkLimitesSL').checked;
        const tagsActifs = [];
        Object.keys(TERRITOIRES).forEach(k => {
            if (document.getElementById(TERRITOIRES[k].checkId).checked) tagsActifs.push(k);
        });

        // Construction du GeoJSON filtré
        let featuresFiltrees = [];
        if (toutSudLorraine) {
            // Tous les segments de tous les territoires (union)
            Object.keys(segmentsParTerritoire).forEach(k => {
                featuresFiltrees = featuresFiltrees.concat(segmentsParTerritoire[k]);
            });
        } else {
            tagsActifs.forEach(k => {
                featuresFiltrees = featuresFiltrees.concat(segmentsParTerritoire[k] || []);
            });
        }

        const opaciteGlob = document.getElementById('sldCEGlobale').value / 100;
        const opaciteEco  = document.getElementById('sldCEEcologique').value / 100;
        const opaciteChim = document.getElementById('sldCEChimique').value / 100;

        const geojsonFiltre = { type: "FeatureCollection", features: featuresFiltrees };

        // --- Qualité Globale ---
        leafletCEGlobale = L.geoJSON(geojsonFiltre, {
            style: f => ({
                color: getColorByQuality(f.properties["Etat masse eau "]),
                weight: 3,
                opacity: opaciteGlob
            }),
            onEachFeature: genererPopup
        }).addTo(coucheCEGlobale);

        // --- Qualité Écologique ---
        leafletCEEcologique = L.geoJSON(geojsonFiltre, {
            style: f => ({
                color: getColorByQuality(f.properties["Etat ecologique"]),
                weight: 3,
                opacity: opaciteEco
            }),
            onEachFeature: genererPopup
        });

        // --- Qualité Chimique ---
        leafletCEChimique = L.geoJSON(geojsonFiltre, {
            style: f => ({
                color: getColorByQuality(f.properties["Etat chimique"]),
                weight: 3,
                opacity: opaciteChim
            }),
            onEachFeature: genererPopup
        });

        rafraichirQualiteCoursDeau();
    }

    function genererPopup(f, layer) {
        const p = f.properties;
        const nom  = p.NomMasseDEau || "Cours d'eau";
        const glob = p["Etat masse eau "] || "Non renseigné";
        const eco  = p["Etat ecologique"]  || "Non renseigné";
        const chim = p["Etat chimique"]    || "Non renseigné";
        const terr = p._territoire         || "";

        layer.bindPopup(`
            <h4>${nom}</h4>
            <ul>
                <li><b>Territoire :</b> ${terr}</li>
                <li><b>Qualité Globale :</b> ${glob}</li>
                <li><b>Qualité Écologique :</b> ${eco}</li>
                <li><b>Qualité Chimique :</b> ${chim}</li>
            </ul>
        `);
    }

    // ================================================================
    // GESTION DU PANNEAU ET DES ÉVÉNEMENTS
    // ================================================================
    const panel = document.getElementById('controlPanel');
    L.DomEvent.disableClickPropagation(panel);
    L.DomEvent.disableScrollPropagation(panel);

    // Basemap
    function rafraichirOpaciteBasemap() {
        const alpha = document.getElementById('sldBasemap').value / 100;
        planIGN.setOpacity(alpha);
        osm.setOpacity(alpha);
    }
    document.getElementById('rbPlanIGN').addEventListener('change', function() {
        if (this.checked) { map.addLayer(planIGN); map.removeLayer(osm); rafraichirOpaciteBasemap(); }
    });
    document.getElementById('rbOSM').addEventListener('change', function() {
        if (this.checked) { map.addLayer(osm); map.removeLayer(planIGN); rafraichirOpaciteBasemap(); }
    });
    document.getElementById('sldBasemap').addEventListener('input', rafraichirOpaciteBasemap);

    // Visibilité des couches territoires
    function bindTerritoireCheckbox(id, couche, nomKey) {
        document.getElementById(id).addEventListener('change', function() {
            this.checked ? map.addLayer(couche) : map.removeLayer(couche);
            filtrerEtAfficherCoursDeau();
        });
    }
    document.getElementById('chkLimitesSL').addEventListener('change', function() {
        this.checked ? map.addLayer(coucheLimitesSL) : map.removeLayer(coucheLimitesSL);
        filtrerEtAfficherCoursDeau();
    });
    bindTerritoireCheckbox('chkSudMeuse',    coucheSudMeuse,    'Sud Meuse');
    bindTerritoireCheckbox('chkSud54',       coucheSud54,       'Sud54');
    bindTerritoireCheckbox('chkVosgesOuest', coucheVosgesOuest, 'Vosges Ouest');
    bindTerritoireCheckbox('chkSDDV',        coucheSDDV,        'SDDV');

    // Opacité couches territoire
    function bindOpaciteTerritoire(sldId, nomKey, estLigne = false) {
        document.getElementById(sldId).addEventListener('input', function() {
            const alpha = this.value / 100;
            const layer = leafletPlaquesRefs[nomKey];
            if (!layer) return;
            layer.setStyle({
                opacity: alpha,
                fillOpacity: estLigne ? 0 : alpha * 0.08
            });
        });
    }
    document.getElementById('sldLimitesSL').addEventListener('input', function() {
        if (geojsonLimitesSL) geojsonLimitesSL.setStyle({ opacity: this.value / 100 });
    });
    bindOpaciteTerritoire('sldSudMeuse',    'Sud Meuse');
    bindOpaciteTerritoire('sldSud54',       'Sud54');
    bindOpaciteTerritoire('sldVosgesOuest', 'Vosges Ouest');
    bindOpaciteTerritoire('sldSDDV',        'SDDV');

    // Qualité cours d'eau
    document.querySelectorAll('input[name="qualiteCE"]').forEach(radio => {
        radio.addEventListener('click', function() {
            optionQualiteActive = this.value;
            rafraichirQualiteCoursDeau();
        });
    });

    // Opacité cours d'eau (live, sans re-clip)
    document.getElementById('sldCEGlobale').addEventListener('input', function() {
        if (leafletCEGlobale) leafletCEGlobale.setStyle({ opacity: this.value / 100 });
    });
    document.getElementById('sldCEEcologique').addEventListener('input', function() {
        if (leafletCEEcologique) leafletCEEcologique.setStyle({ opacity: this.value / 100 });
    });
    document.getElementById('sldCEChimique').addEventListener('input', function() {
        if (leafletCEChimique) leafletCEChimique.setStyle({ opacity: this.value / 100 });
    });

    function rafraichirQualiteCoursDeau() {
        map.removeLayer(coucheCEGlobale);
        map.removeLayer(coucheCEEcologique);
        map.removeLayer(coucheCEChimique);

        if (optionQualiteActive === "globale")     map.addLayer(coucheCEGlobale);
        if (optionQualiteActive === "ecologique")  map.addLayer(coucheCEEcologique);
        if (optionQualiteActive === "chimique")    map.addLayer(coucheCEChimique);

        legende.update();
    }

    // ================================================================
    // LÉGENDE
    // ================================================================
    const legende = L.control({ position: 'bottomright' });
    legende.onAdd = function() {
        this._div = L.DomUtil.create('div', 'info legend');
        this.update();
        return this._div;
    };
    legende.update = function() {
        let titre = "", items = [];
        if (optionQualiteActive === "globale") {
            titre = "Qualité Globale";
            items = [
                { label: "Bon / Très Bon", color: "#33bbff" },
                { label: "Moyen",          color: "#ffd000" },
                { label: "Médiocre",       color: "#ff7700" },
                { label: "Mauvais",        color: "#ff0000" },
                { label: "Inconnu",        color: "#888888" }
            ];
        } else if (optionQualiteActive === "ecologique") {
            titre = "Qualité Écologique";
            items = [
                { label: "Très bon", color: "#0055ff" },
                { label: "Bon",      color: "#33bbff" },
                { label: "Moyen",    color: "#ffd000" },
                { label: "Médiocre", color: "#ff7700" },
                { label: "Mauvais",  color: "#ff0000" },
                { label: "Inconnu",  color: "#888888" }
            ];
        } else if (optionQualiteActive === "chimique") {
            titre = "Qualité Chimique";
            items = [
                { label: "Bon",              color: "#33bbff" },
                { label: "Non atteint",      color: "#a020f0" },
                { label: "Inconnu",          color: "#888888" }
            ];
        }
        this._div.style.display = titre ? 'block' : 'none';
        let html = `<h4>${titre}</h4>`;
        items.forEach(it => { html += `<i style="background:${it.color}"></i> ${it.label}<br>`; });
        this._div.innerHTML = html;
    };
    legende.addTo(map);

    </script>
</body>
</html>
