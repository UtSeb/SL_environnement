<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="https://davicorrea.github.io/leaflet-styledlayercontrol/css/styledLayerControl.css" />

    <style>
        /* Reset et plein écran */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212; /* Mode sombre */
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* Popups */
        .leaflet-popup-content h4 {
            margin: 0 0 8px 0;
            color: #3388ff;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        .leaflet-popup-content ul {
            padding-left: 15px;
            margin: 5px 0;
        }
        
        /* Personnalisation du panneau de contrôle (Style Sombre Pro) */
        .ac-container {
            background: #222222 !important;
            color: #ffffff !important;
            border: 2px solid #444444 !important;
            border-radius: 8px !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
        }
        .ac-container label {
            color: #00ffcc !important;
            font-weight: bold !important;
        }
        .ac-container article label {
            color: #ffffff !important;
            font-weight: normal !important;
        }

        /* Style de la Légende Dynamique */
        .info.legend {
            background: #222222;
            color: #ffffff;
            padding: 12px;
            border: 2px solid #444444;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 13px;
            line-height: 18px;
            font-family: Arial, sans-serif;
        }
        .info.legend h4 {
            margin: 0 0 8px 0;
            color: #00ffcc;
            font-size: 14px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }
        .legend i {
            width: 18px;
            height: 6px;
            float: left;
            margin-right: 8px;
            margin-top: 6px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script src="https://davicorrea.github.io/leaflet-styledlayercontrol/src/styledLayerControl.js"></script>

    <script>
        // -------------------------------------------------------------
        // FONCTION DE REPROJECTION LAMBERT-93 (EPSG:2154) -> WGS84 (EPSG:4326)
        // -------------------------------------------------------------
        function reprojectLambert93ToWGS84(coords) {
            const X = coords[0]; const Y = coords[1];
            const c = 11754255.426; const n = 0.725607765053267;
            const xs = 700000; const ys = 12655612.0493776; const e = 0.0818191910428158;
            const dx = X - xs; const dy = Y - ys;
            const R = Math.sqrt(dx * dx + dy * dy); const gamma = Math.atan(dx / -dy);
            const latIso = Math.log(c / R) / n;
            let lat = 2 * Math.atan(Math.exp(latIso)) - Math.PI / 2;
            for (let i = 0; i < 5; i++) {
                const sinLat = Math.sin(lat);
                lat = 2 * Math.atan(Math.pow((1 + e * sinLat) / (1 - e * sinLat), e / 2) * Math.exp(latIso)) - Math.PI / 2;
            }
            const lon = gamma / n + (3 * Math.PI / 180);
            return [lon * 180 / Math.PI, lat * 180 / Math.PI];
        }

        function fixGeoJSONProjection(geojson) {
            if (!geojson || !geojson.crs || !geojson.crs.properties || !geojson.crs.properties.name.includes("2154")) return geojson;
            const transformCoords = (coords, type) => {
                if (type === "Point") return reprojectLambert93ToWGS84(coords);
                if (type === "LineString" || type === "MultiPoint") return coords.map(reprojectLambert93ToWGS84);
                if (type === "Polygon" || type === "MultiLineString") return coords.map(ring => ring.map(reprojectLambert93ToWGS84));
                if (type === "MultiPolygon") return coords.map(poly => poly.map(ring => ring.map(reprojectLambert93ToWGS84)));
                return coords;
            };
            geojson.features.forEach(feature => {
                if (feature.geometry) feature.geometry.coordinates = transformCoords(feature.geometry.coordinates, feature.geometry.type);
            });
            return geojson;
        }

        // -------------------------------------------------------------
        // FONCTION DE COLORATION DE LA QUALITÉ SIVANT LES ATTRIBUTS SPECIFIQUES
        // -------------------------------------------------------------
        function getColorByQuality(valeur) {
            if (!valeur) return "#888888";
            const v = valeur.trim().toLowerCase();
            
            if (v === "très bon" || v === "très bon état") return "#0055ff"; // Bleu foncé
            if (v === "bon" || v === "bon état") return "#33bbff";          // Bleu clair
            if (v === "moyen" || v === "état moyen") return "#ffd000";      // Jaune
            if (v === "médiocre" || v === "médiocre état") return "#ff7700"; // Orange
            if (v === "mauvais" || v === "mauvais état") return "#ff0000";   // Rouge
            if (v === "non atteint") return "#a020f0";                       // Violet (Spécifique chimie)
            return "#888888"; // Gris pour "Inconnu" ou "Non renseigné"
        }

        // -------------------------------------------------------------
        // INITIALISATION DE LA CARTE
        // -------------------------------------------------------------
        const map = L.map('map').setView([48.5000, 6.2000], 8.5);

        // Fonds de carte
        const planIGN = L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; <a href="https://www.ign.fr/">IGN</a>'
        }).addTo(map);

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        // Groupes de couches
        const coucheLimitesSL = L.layerGroup().addTo(map);
        const coucheSudMeuse = L.layerGroup().addTo(map);
        const coucheSud54 = L.layerGroup().addTo(map);
        const coucheVosgesOuest = L.layerGroup().addTo(map);
        const coucheSDDV = L.layerGroup().addTo(map);

        const coucheCEQualiteGlobale = L.layerGroup().addTo(map); // Activé par défaut
        const coucheCEQualiteEcologique = L.layerGroup();
        const coucheCEQualiteChimique = L.layerGroup();

        // -------------------------------------------------------------
        // CHARGEMENT DES DONNÉES GEOJSON
        // -------------------------------------------------------------
        fetch('data/Limites SL.geojson').then(r => r.json()).then(data => {
            L.geoJSON(fixGeoJSONProjection(data), { style: { color: "#ff3333", weight: 3.5, fillOpacity: 0, dashArray: "6, 12" } }).addTo(coucheLimitesSL);
        });

        fetch('data/Plaque SudMeuse.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#e6194B', weight: 2, fillColor: '#e6194B', fillOpacity: 0.1 } }).addTo(coucheSudMeuse);
        });
        fetch('data/Plaque Sud54.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#3cb44b', weight: 2, fillColor: '#3cb44b', fillOpacity: 0.1 } }).addTo(coucheSud54);
        });
        fetch('data/Plaque Vosges Ouest.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#ffe119', weight: 2, fillColor: '#ffe119', fillOpacity: 0.1 } }).addTo(coucheVosgesOuest);
        });
        fetch('data/Plaque SDDV.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#4363d8', weight: 2, fillColor: '#4363d8', fillOpacity: 0.1 } }).addTo(coucheSDDV);
        });

        fetch('data/Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson').then(r => r.json()).then(data => {
            // A. Globale
            L.geoJSON(data, {
                style: function(f) { return { color: getColorByQuality(f.properties["Etat masse eau "]), weight: 2.5, opacity: 0.85 }; },
                onEachFeature: genererPopup
            }).addTo(coucheCEQualiteGlobale);
            // B. Écologique
            L.geoJSON(data, {
                style: function(f) { return { color: getColorByQuality(f.properties["Etat ecologique"]), weight: 2.5, opacity: 0.85 }; },
                onEachFeature: genererPopup
            }).addTo(coucheCEQualiteEcologique);
            // C. Chimique
            L.geoJSON(data, {
                style: function(f) { return { color: getColorByQuality(f.properties["Etat chimique"]), weight: 2.5, opacity: 0.85 }; },
                onEachFeature: genererPopup
            }).addTo(coucheCEQualiteChimique);
        });

        function genererPopup(f, layer) {
            const props = f.properties;
            layer.bindPopup(`
                <h4>${props.NomMasseDEau || "Inconnu"}</h4>
                <ul>
                    <li><b>Qualité Globale :</b> ${props["Etat masse eau "] || "Non renseigné"}</li>
                    <li><b>Qualité Écologique :</b> ${props["Etat ecologique"] || "Non renseigné"}</li>
                    <li><b>Qualité Chimique :</b> ${props["Etat chimique"] || "Non renseigné"}</li>
                </ul>
            `);
        }

        // -------------------------------------------------------------
        // STRUCTURE DU PANNEAU DE CONTROLE (StyledLayerControl)
        // -------------------------------------------------------------
        const baseMaps = [
            { groupName: "Fonds de carte", layers: [{ name: "Plan IGN (Officiel)", layer: planIGN }, { name: "OpenStreetMap", layer: osm }] }
        ];

        const overlayMaps = [
            { groupName: "Périmètre", layers: [{ name: "Limites Sud-Lorraine", layer: coucheLimitesSL }] },
            { 
                groupName: "Territoires", 
                layers: [
                    { name: "Sud Meuse", layer: coucheSudMeuse },
                    { name: "Sud 54", layer: coucheSud54 },
                    { name: "Vosges Ouest", layer: coucheVosgesOuest },
                    { name: "Saint-Dié (SDDV)", layer: coucheSDDV }
                ] 
            },
            { 
                groupName: "Cours d'eau", 
                layers: [
                    { name: "Qualité globale", layer: coucheCEQualiteGlobale },
                    { name: "Qualité écologique", layer: coucheCEQualiteEcologique },
                    { name: "Qualité chimique", layer: coucheCEQualiteChimique }
                ] 
            }
        ];

        // Rendu du menu principal
        const controlOptions = { container_width: "280px", group_maxHeight: "200px", collapsed: false };
        const menuControl = L.Control.styledLayerControl(baseMaps, overlayMaps, controlOptions).addTo(map);

        // Securisation anti-zoom / anti-propagation sur le menu
        const containerHtml = menuControl.getContainer();
        L.DomEvent.disableClickPropagation(containerHtml);
        L.DomEvent.disableScrollPropagation(containerHtml);

        // -------------------------------------------------------------
        // CREATION DE LA LEGENDE DYNAMIQUE
        // -------------------------------------------------------------
        const legende = L.control({ position: 'bottomright' });

        legende.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info legend');
            this.update();
            return this._div;
        };

        legende.update = function () {
            let typeQualite = "";
            let items = [];

            // Détection de la couche active pour adapter les intitulés exacts demandés
            if (map.hasLayer(coucheCEQualiteGlobale)) {
                typeQualite = "Qualité Globale";
                items = [
                    { label: "Bon", color: "#33bbff" },
                    { label: "Moyen", color: "#ffd000" },
                    { label: "Médiocre", color: "#ff7700" },
                    { label: "Mauvais", color: "#ff0000" },
                    { label: "Inconnu", color: "#888888" }
                ];
            } else if (map.hasLayer(coucheCEQualiteEcologique)) {
                typeQualite = "Qualité Écologique";
                items = [
                    { label: "Très bon", color: "#0055ff" },
                    { label: "Bon", color: "#33bbff" },
                    { label: "Moyen", color: "#ffd000" },
                    { label: "Médiocre", color: "#ff7700" },
                    { label: "Mauvais", color: "#ff0000" }
                ];
            } else if (map.hasLayer(coucheCEQualiteChimique)) {
                typeQualite = "Qualité Chimique";
                items = [
                    { label: "Bon", color: "#33bbff" },
                    { label: "Non atteint", color: "#a020f0" },
                    { label: "Inconnu", color: "#888888" }
                ];
            }

            // Si aucune couche de cours d'eau n'est active, on cache visuellement la légende
            if (!typeQualite) {
                this._div.style.display = 'none';
                return;
            }
            
            this._div.style.display = 'block';
            let htmlContenu = `<h4>${typeQualite}</h4>`;
            items.forEach(item => {
                htmlContenu += `<i style="background: ${item.color}"></i> ${item.label}<br>`;
            });
            this._div.innerHTML = htmlContenu;
        };

        legende.addTo(map);

        // Événements pour mettre à jour la légende à la volée quand l'utilisateur coche/décoche le menu
        map.on('layeradd layerremove', function () {
            legende.update();
        });

    </script>
</body>
</html>
