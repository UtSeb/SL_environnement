<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-groupedlayercontrol/0.6.1/leaflet.groupedlayercontrol.min.css" />

    <style>
        /* Reset et plein écran */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212; /* Mode sombre par défaut pour l'interface */
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* Style personnalisé pour les fenêtres popups */
        .leaflet-popup-content h4 {
            margin: 0 0 8px 0;
            color: #3388ff;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        .leaflet-popup-content ul {
            padding-left: 15px;
            margin: 5px 0;
        }
        /* Ajustement esthétique pour le menu groupé style sombre */
        .leaflet-control-layers {
            background: #222 !important;
            color: #fff !important;
            border: 1px solid #444 !important;
            border-radius: 8px !important;
            padding: 10px !important;
        }
        .leaflet-groupedlayers-group {
            margin-bottom: 8px !important;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }
        .leaflet-groupedlayers-title {
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-groupedlayercontrol/0.6.1/leaflet.groupedlayercontrol.min.js"></script>

    <script>
        // -------------------------------------------------------------
        // FONCTION DE REPROJECTION LAMBERT-93 (EPSG:2154) -> WGS84 (EPSG:4326)
        // -------------------------------------------------------------
        function reprojectLambert93ToWGS84(coords) {
            const X = coords[0];
            const Y = coords[1];
            const c = 11754255.426; 
            const n = 0.725607765053267;
            const xs = 700000;
            const ys = 12655612.0493776;
            const e = 0.0818191910428158;
            
            const dx = X - xs;
            const dy = Y - ys;
            const R = Math.sqrt(dx * dx + dy * dy);
            const gamma = Math.atan(dx / -dy);
            
            const latIso = Math.log(c / R) / n;
            let lat = 2 * Math.atan(Math.exp(latIso)) - Math.PI / 2;
            
            for (let i = 0; i < 5; i++) {
                const sinLat = Math.sin(lat);
                lat = 2 * Math.atan(Math.pow((1 + e * sinLat) / (1 - e * sinLat), e / 2) * Math.exp(latIso)) - Math.PI / 2;
            }
            const lon = gamma / n + (3 * Math.PI / 180);
            return [lon * 180 / Math.PI, lat * 180 / Math.PI];
        }

        function fixGeoJSONProjection(geojson) {
            if (!geojson || !geojson.crs || !geojson.crs.properties || !geojson.crs.properties.name.includes("2154")) {
                return geojson;
            }
            const transformCoords = (coords, type) => {
                if (type === "Point") return reprojectLambert93ToWGS84(coords);
                if (type === "LineString" || type === "MultiPoint") return coords.map(reprojectLambert93ToWGS84);
                if (type === "Polygon" || type === "MultiLineString") return coords.map(ring => ring.map(reprojectLambert93ToWGS84));
                if (type === "MultiPolygon") return coords.map(poly => poly.map(ring => ring.map(reprojectLambert93ToWGS84)));
                return coords;
            };
            geojson.features.forEach(feature => {
                if (feature.geometry) {
                    feature.geometry.coordinates = transformCoords(feature.geometry.coordinates, feature.geometry.type);
                }
            });
            return geojson;
        }

        // -------------------------------------------------------------
        // FONCTION DE COLORATION SUIVANT LA QUALITÉ (Du Rouge au Bleu)
        // -------------------------------------------------------------
        function getColorByQuality(valeur) {
            if (!valeur) return "#888888";
            const v = valeur.trim().toLowerCase();
            
            if (v.includes("très bon") || v === "bon" || v.includes("bon état") || v.includes("très bon état")) {
                return "#0055ff"; // Bleu (Bon / Très bon)
            } else if (v.includes("moyen") || v.includes("état moyen")) {
                return "#ffd000"; // Jaune (Moyen)
            } else if (v.includes("médiocre")) {
                return "#ff7700"; // Orange (Médiocre)
            } else if (v.includes("mauvais")) {
                return "#ff0000"; // Rouge (Mauvais)
            }
            return "#888888"; // Gris par défaut (Inconnu / Non concerné)
        }

        // -------------------------------------------------------------
        // INITIALISATION DE LA CARTE
        // -------------------------------------------------------------
        const map = L.map('map').setView([48.5000, 6.2000], 8.5);

        // Fonds de carte
        const planIGN = L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; <a href="https://www.ign.fr/">IGN</a>',
            minZoom: 0,
            maxZoom: 19
        }).addTo(map);

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // Groupes de couches pour l'interface
        const coucheLimitesSL = L.layerGroup().addTo(map);
        const coucheSudMeuse = L.layerGroup().addTo(map);
        const coucheSud54 = L.layerGroup().addTo(map);
        const coucheVosgesOuest = L.layerGroup().addTo(map);
        const coucheSDDV = L.layerGroup().addTo(map);

        // Les 3 couches thématiques de cours d'eau
        const coucheCEQualiteGlobale = L.layerGroup().addTo(map); // Activé par défaut
        const coucheCEQualiteEcologique = L.layerGroup();
        const coucheCEQualiteChimique = L.layerGroup();

        // Styles de base
        const styleLimitesSL = { color: "#ff3333", weight: 3.5, fillOpacity: 0, dashArray: "6, 12" };

        // -------------------------------------------------------------
        // CHARGEMENT DES GEOJSON
        // -------------------------------------------------------------

        // 1. Limites Globales Sud-Lorraine
        fetch('data/Limites SL.geojson')
            .then(response => response.json())
            .then(data => {
                const dataWGS84 = fixGeoJSONProjection(data);
                L.geoJSON(dataWGS84, { style: styleLimitesSL }).addTo(coucheLimitesSL);
            });

        // 2. Les 4 Territoires
        fetch('data/Plaque SudMeuse.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#e6194B', weight: 2, fillColor: '#e6194B', fillOpacity: 0.1 } }).addTo(coucheSudMeuse);
        });
        fetch('data/Plaque Sud54.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#3cb44b', weight: 2, fillColor: '#3cb44b', fillOpacity: 0.1 } }).addTo(coucheSud54);
        });
        fetch('data/Plaque Vosges Ouest.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#ffe119', weight: 2, fillColor: '#ffe119', fillOpacity: 0.1 } }).addTo(coucheVosgesOuest);
        });
        fetch('data/Plaque SDDV.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#4363d8', weight: 2, fillColor: '#4363d8', fillOpacity: 0.1 } }).addTo(coucheSDDV);
        });

        // 3. Cours d'eau (Génération des 3 visualisations thématiques)
        fetch('data/Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson')
            .then(response => response.json())
            .then(data => {
                
                // --- A. COUCHE QUALITÉ GLOBALE ---
                L.geoJSON(data, {
                    style: function(feature) {
                        return { color: getColorByQuality(feature.properties["Etat masse eau "]), weight: 2.5, opacity: 0.85 };
                    },
                    onEachFeature: genererPopupCoursDEau
                }).addTo(coucheCEQualiteGlobale);

                // --- B. COUCHE QUALITÉ ÉCOLOGIQUE ---
                L.geoJSON(data, {
                    style: function(feature) {
                        return { color: getColorByQuality(feature.properties["Etat ecologique"]), weight: 2.5, opacity: 0.85 };
                    },
                    onEachFeature: genererPopupCoursDEau
                }).addTo(coucheCEQualiteEcologique);

                // --- C. COUCHE QUALITÉ CHIMIQUE ---
                L.geoJSON(data, {
                    style: function(feature) {
                        return { color: getColorByQuality(feature.properties["Etat chimique"]), weight: 2.5, opacity: 0.85 };
                    },
                    onEachFeature: genererPopupCoursDEau
                }).addTo(coucheCEQualiteChimique);
            })
            .catch(error => console.error("Erreur cours d'eau :", error));

        // Fonction commune pour générer le contenu de la Popup au clic
        function genererPopupCoursDEau(feature, layer) {
            const props = feature.properties;
            const nom = props.NomMasseDEau || "Inconnu";
            const etatGeneral = props["Etat masse eau "] || "Non renseigné";
            const etatEcologique = props["Etat ecologique"] || "Non renseigné";
            const etatChimique = props["Etat chimique"] || "Non renseigné";

            const popupContenu = `
                <h4>${nom}</h4>
                <ul>
                    <li><b>Qualité Globale :</b> ${etatGeneral}</li>
                    <li><b>Qualité Écologique :</b> ${etatEcologique}</li>
                    <li><b>Qualité Chimique :</b> ${etatChimique}</li>
                </ul>
            `;
            layer.bindPopup(popupContenu);
        }

        // -------------------------------------------------------------
        // CONTRÔLE DES COUCHES GROUPÉES (STRUCTURE À TIROIRS)
        // -------------------------------------------------------------
        const baseMaps = {
            "Plan IGN (Officiel)": planIGN,
            "OpenStreetMap": osm
        };

        // Organisation de la structure arborescente (Tiroirs)
        const groupedOverlays = {
            "Périmètre": {
                "Limites Sud-Lorraine": coucheLimitesSL
            },
            "Territoires": {
                "Sud Meuse": coucheSudMeuse,
                "Sud 54": coucheSud54,
                "Vosges Ouest": coucheVosgesOuest,
                "Saint-Dié (SDDV)": coucheSDDV
            },
            "Cours d'eau": {
                "Qualité globale": coucheCEQualiteGlobale,
                "Qualité écologique": coucheCEQualiteEcologique,
                "Qualité chimique": coucheCEQualiteChimique
            }
        };

        // Options du menu à tiroir
        const optionsMenu = {
            collapsed: false, // Laisse le menu ouvert par défaut
            exclusiveGroups: ["Cours d'eau"] // Permet de n'avoir qu'UNE SEULE analyse de cours d'eau cochée à la fois (évite la superposition brouillonne)
        };

        // Activation du plugin de contrôle groupé
        L.control.groupedLayers(baseMaps, groupedOverlays, optionsMenu).addTo(map);
    </script>
</body>
</html>
