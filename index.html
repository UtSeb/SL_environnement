<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        /* Reset et plein écran */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212; /* Mode sombre par défaut pour l'interface */
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Initialisation de la carte centrée sur la Lorraine (Nancy/Sud Lorraine)
        const map = L.map('map').setView([48.6936, 6.1846], 9);

        /* Flux WMTS Géoplateforme IGN — Plan de fond standard
           Cet endpoint public est le plus stable pour un déploiement HTTPS sur GitHub Pages
        */
        const planIGN = L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; <a href="https://www.ign.fr/">IGN</a>',
            minZoom: 0,
            maxZoom: 19
        }).addTo(map); // Ajouté par défaut à l'affichage

        // Fond OpenStreetMap standard en alternative
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // Contrôle des couches pour basculer de l'un à l'autre dans l'interface
        const baseMaps = {
            "Plan IGN (Officiel)": planIGN,
            "OpenStreetMap": osm
        };
        L.control.layers(baseMaps).addTo(map);
    </script>
</body>
</html>
