<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Nouvelle Webmap — SIG</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-plugins/3.4.0/control/L.Control.Layers.Tree.css" />

    <style>
        /* Reset et plein écran */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212; /* Mode sombre */
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* Style personnalisé pour les fenêtres popups */
        .leaflet-popup-content h4 {
            margin: 0 0 8px 0;
            color: #3388ff;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        .leaflet-popup-content ul {
            padding-left: 15px;
            margin: 5px 0;
        }
        
        /* Personnalisation avancée du panneau de contrôle (Style Sombre Professionnel) */
        .leaflet-control-layers {
            background: #222222 !important;
            color: #ffffff !important;
            border: 2px solid #444444 !important;
            border-radius: 8px !important;
            padding: 12px !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
            max-height: 85vh;
            overflow-y: auto;
        }
        /* Style des lignes de l'arbre */
        .leaflet-layerstree-header {
            font-size: 14px;
            padding: 2px 0;
        }
        /* Mise en valeur des catégories parentes (Périmètre, Territoires, Cours d'eau) */
        .leaflet-layerstree-header-name {
            font-weight: bold;
            color: #00ffcc;
        }
        /* Style pour les vraies couches enfants */
        .leaflet-layerstree-child {
            padding-left: 15px !important;
        }
        .leaflet-layerstree-node .leaflet-layerstree-header-name {
            color: #ffffff; /* Couches enfants en blanc */
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script src="https://img.webme.com/pic/e/estevez-sig/L.Control.Layers.Tree.js"></script>

    <script>
        // -------------------------------------------------------------
        // FONCTION DE REPROJECTION LAMBERT-93 (EPSG:2154) -> WGS84 (EPSG:4326)
        // -------------------------------------------------------------
        function reprojectLambert93ToWGS84(coords) {
            const X = coords[0];
            const Y = coords[1];
            const c = 11754255.426; 
            const n = 0.725607765053267;
            const xs = 700000;
            const ys = 12655612.0493776;
            const e = 0.0818191910428158;
            
            const dx = X - xs;
            const dy = Y - ys;
            const R = Math.sqrt(dx * dx + dy * dy);
            const gamma = Math.atan(dx / -dy);
            
            const latIso = Math.log(c / R) / n;
            let lat = 2 * Math.atan(Math.exp(latIso)) - Math.PI / 2;
            
            for (let i = 0; i < 5; i++) {
                const sinLat = Math.sin(lat);
                lat = 2 * Math.atan(Math.pow((1 + e * sinLat) / (1 - e * sinLat), e / 2) * Math.exp(latIso)) - Math.PI / 2;
            }
            const lon = gamma / n + (3 * Math.PI / 180);
            return [lon * 180 / Math.PI, lat * 180 / Math.PI];
        }

        function fixGeoJSONProjection(geojson) {
            if (!geojson || !geojson.crs || !geojson.crs.properties || !geojson.crs.properties.name.includes("2154")) {
                return geojson;
            }
            const transformCoords = (coords, type) => {
                if (type === "Point") return reprojectLambert93ToWGS84(coords);
                if (type === "LineString" || type === "MultiPoint") return coords.map(reprojectLambert93ToWGS84);
                if (type === "Polygon" || type === "MultiLineString") return coords.map(ring => ring.map(reprojectLambert93ToWGS84));
                if (type === "MultiPolygon") return coords.map(poly => poly.map(ring => ring.map(reprojectLambert93ToWGS84)));
                return coords;
            };
            geojson.features.forEach(feature => {
                if (feature.geometry) {
                    feature.geometry.coordinates = transformCoords(feature.geometry.coordinates, feature.geometry.type);
                }
            });
            return geojson;
        }

        // -------------------------------------------------------------
        // FONCTION DE COLORATION DE LA QUALITÉ (Du Rouge au Bleu)
        // -------------------------------------------------------------
        function getColorByQuality(valeur) {
            if (!valeur) return "#888888";
            const v = valeur.trim().toLowerCase();
            
            if (v.includes("très bon") || v === "bon" || v.includes("bon état") || v.includes("très bon état")) {
                return "#0055ff"; // Bleu
            } else if (v.includes("moyen") || v.includes("état moyen")) {
                return "#ffd000"; // Jaune
            } else if (v.includes("médiocre")) {
                return "#ff7700"; // Orange
            } else if (v.includes("mauvais")) {
                return "#ff0000"; // Rouge
            }
            return "#888888"; // Gris
        }

        // -------------------------------------------------------------
        // INITIALISATION DE LA CARTE
        // -------------------------------------------------------------
        const map = L.map('map').setView([48.5000, 6.2000], 8.5);

        // Fonds de carte
        const planIGN = L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; <a href="https://www.ign.fr/">IGN</a>',
            minZoom: 0,
            maxZoom: 19
        }).addTo(map);

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // Instanciation des Groupes de couches
        const coucheLimitesSL = L.layerGroup().addTo(map);
        const coucheSudMeuse = L.layerGroup().addTo(map);
        const coucheSud54 = L.layerGroup().addTo(map);
        const coucheVosgesOuest = L.layerGroup().addTo(map);
        const coucheSDDV = L.layerGroup().addTo(map);

        const coucheCEQualiteGlobale = L.layerGroup().addTo(map); // Activée par défaut
        const coucheCEQualiteEcologique = L.layerGroup();
        const coucheCEQualiteChimique = L.layerGroup();

        // Style limites SL
        const styleLimitesSL = { color: "#ff3333", weight: 3.5, fillOpacity: 0, dashArray: "6, 12" };

        // -------------------------------------------------------------
        // CHARGEMENT DES GEOJSON
        // -------------------------------------------------------------

        // 1. Limites Globales Sud-Lorraine
        fetch('data/Limites SL.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(fixGeoJSONProjection(data), { style: styleLimitesSL }).addTo(coucheLimitesSL);
            });

        // 2. Les 4 Territoires
        fetch('data/Plaque SudMeuse.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#e6194B', weight: 2, fillColor: '#e6194B', fillOpacity: 0.1 } }).addTo(coucheSudMeuse);
        });
        fetch('data/Plaque Sud54.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#3cb44b', weight: 2, fillColor: '#3cb44b', fillOpacity: 0.1 } }).addTo(coucheSud54);
        });
        fetch('data/Plaque Vosges Ouest.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#ffe119', weight: 2, fillColor: '#ffe119', fillOpacity: 0.1 } }).addTo(coucheVosgesOuest);
        });
        fetch('data/Plaque SDDV.geojson').then(r => r.json()).then(d => {
            L.geoJSON(fixGeoJSONProjection(d), { style: { color: '#4363d8', weight: 2, fillColor: '#4363d8', fillOpacity: 0.1 } }).addTo(coucheSDDV);
        });

        // 3. Cours d'eau (Génération des 3 visualisations thématiques)
        fetch('data/Etats general - ecologique - chimique - masses eaux Sl-alleger.geojson')
            .then(response => response.json())
            .then(data => {
                // A. Qualité Globale
                L.geoJSON(data, {
                    style: function(feature) { return { color: getColorByQuality(feature.properties["Etat masse eau "]), weight: 2.5, opacity: 0.85 }; },
                    onEachFeature: genererPopupCoursDEau
                }).addTo(coucheCEQualiteGlobale);

                // B. Qualité Écologique
                L.geoJSON(data, {
                    style: function(feature) { return { color: getColorByQuality(feature.properties["Etat ecologique"]), weight: 2.5, opacity: 0.85 }; },
                    onEachFeature: genererPopupCoursDEau
                }).addTo(coucheCEQualiteEcologique);

                // C. Qualité Chimique
                L.geoJSON(data, {
                    style: function(feature) { return { color: getColorByQuality(feature.properties["Etat chimique"]), weight: 2.5, opacity: 0.85 }; },
                    onEachFeature: genererPopupCoursDEau
                }).addTo(coucheCEQualiteChimique);
            });

        function genererPopupCoursDEau(feature, layer) {
            const props = feature.properties;
            const popupContenu = `
                <h4>${props.NomMasseDEau || "Inconnu"}</h4>
                <ul>
                    <li><b>Qualité Globale :</b> ${props["Etat masse eau "] || "Non renseigné"}</li>
                    <li><b>Qualité Écologique :</b> ${props["Etat ecologique"] || "Non renseigné"}</li>
                    <li><b>Qualité Chimique :</b> ${props["Etat chimique"] || "Non renseigné"}</li>
                </ul>
            `;
            layer.bindPopup(popupContenu);
        }

        // -------------------------------------------------------------
        // CONFIGURATION DE L'ARBRE DE COUCHES CONTROLEES (L.Control.Layers.Tree)
        // -------------------------------------------------------------
        
        // Fonds de carte (Boutons radio standards)
        const baseTree = {
            label: '<b>Fonds de carte</b>',
            children: [
                { label: 'Plan IGN (Officiel)', layer: planIGN },
                { label: 'OpenStreetMap', layer: osm }
            ]
        };

        // Couches de données structurées sous forme d'arbre imbriqué avec cases à cocher parentes
        const overlaysTree = {
            label: 'Données Sud-Lorraine',
            selectAllCheckbox: true, // Bouton global optionnel
            children: [
                {
                    label: '<span class="leaflet-layerstree-header-name">Périmètre</span>',
                    selectAllCheckbox: false,
                    children: [
                        { label: 'Limites Sud-Lorraine', layer: coucheLimitesSL }
                    ]
                },
                {
                    label: '<span class="leaflet-layerstree-header-name">Territoires</span>',
                    selectAllCheckbox: true, // Génère la case à cocher maîtresse devant "Territoires"
                    children: [
                        { label: 'Sud Meuse', layer: coucheSudMeuse },
                        { label: 'Sud 54', layer: coucheSud54 },
                        { label: 'Vosges Ouest', layer: coucheVosgesOuest },
                        { label: 'Saint-Dié (SDDV)', layer: coucheSDDV }
                    ]
                },
                {
                    label: '<span class="leaflet-layerstree-header-name">Cours d\'eau</span>',
                    selectAllCheckbox: false, // Pas de case globale ici car ce sont des boutons radio exclusifs
                    children: [
                        // RadioKey permet de transformer ces sous-couches en boutons radios exclusifs (une seule active à la fois)
                        { label: 'Qualité globale', layer: coucheCEQualiteGlobale, radioKey: 'ce_radio' },
                        { label: 'Qualité écologique', layer: coucheCEQualiteEcologique, radioKey: 'ce_radio' },
                        { label: 'Qualité chimique', layer: coucheCEQualiteChimique, radioKey: 'ce_radio' }
                    ]
                }
            ]
        };

        // Création et configuration du panneau de contrôle de l'arbre
        const menuArbre = L.control.layers.tree(baseTree, overlaysTree, {
            collapsed: false, // Reste déroulé à l'écran
            namedToggle: false
        }).addTo(map);

        // -------------------------------------------------------------
        // REGLAGE DU BUG DE CLIC TRANSPARENT (ANTI-PROPAGATION)
        // -------------------------------------------------------------
        const conteneurMenu = menuArbre.getContainer();
        
        // Bloque le clic, le double-clic, le scroll de souris et le mousedown pour empêcher la carte de réagir en arrière-plan
        L.DomEvent.disableClickPropagation(conteneurMenu);
        L.DomEvent.disableScrollPropagation(conteneurMenu);

    </script>
</body>
</html>
